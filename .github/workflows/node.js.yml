# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # Release-gate honest matrix: package engines is >=22 and jsdom 30
        # requires >=22 — on 18/20 the smoke suite silently skips (exit 0),
        # which produced fake-green CI lanes. Node 18/20 lanes removed.
        # P1-GAP-02 (Chat 2 remediation): engines >=22 is additionally ENFORCED
        # in tests/run.js — an old Node now fails loudly instead of skipping.

    services:
      # P1-GAP-01 (Chat 2 remediation): the live-PG suites are first-class CI
      # citizens now — without PostgreSQL they FAIL by design (no more
      # skip/fake-green), so CI must provide a real one.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payesh
          POSTGRES_PASSWORD: payesh
          POSTGRES_DB: payesh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Phase-2 remediation (BLOCKER 8): Redis is a first-class dependency too —
      # otp-redis and the fail-closed probe run against this real service.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGURL: postgres://payesh:payesh@127.0.0.1:5432/payesh_ci
      REDIS_URL: redis://127.0.0.1:6379

    steps:
    # F-QA-07 (Chat 4 remediation): the release-version contract inspects git tags
    # (`git tag -l 'v*'` and `git show <tag>:package.json`). actions/checkout defaults to
    # a shallow, tag-less fetch, where that gate would be meaningless. Verified locally:
    # in a `--depth 1 --no-tags` clone the contract exits 1 with "no vX.Y.Z tag found" —
    # it fails loudly rather than passing vacuously, but CI still needs real history.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Runtime Reliability — Lease fencing static contract
      run: node tests/outbox-lease-fencing.test.js
    - name: Runtime Reliability — DLQ atomic terminal transition
      run: node tests/outbox-dlq-atomicity.test.js
    - name: Runtime Reliability — isolated fresh-DB lease race proof
      run: |
        set -euo pipefail
        RRDB="payesh_runtime_reliability"
        RRURL="postgres://payesh:payesh@127.0.0.1:5432/$RRDB"
        cleanup() { psql "$PGURL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RRDB;" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        psql "$PGURL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RRDB;"
        psql "$PGURL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $RRDB;"
        DATABASE_URL="$RRURL" node tools/migrate-ledger.js up
        DATABASE_URL="$RRURL" node tests/outbox-lease-race-live.js
    # Runtime Reliability gate is intentionally early: its failure must not be hidden by later release gates.

    # QA false-green gates run before dependency-heavy live stages.
    - name: Stale path contract — historical TODO redirect
      run: node tests/stale-path-contract.js
    - name: Critical orphan — seed integrity
      run: node tests/seed-integrity.js
    - name: Phase 7 verifier contract — fixture/boundary regression
      run: node tests/phase7-production-verifier-contract.test.js
    - name: Critical orphan — server security regression
      run: node tests/security2.js
    - name: Critical orphan — atomic sync batch
      run: node tests/sync-atomic-batch.js
    - name: Critical orphan — duplicate claim/idempotency
      run: node tests/sync-dup-claim.js
    - name: Critical orphan — DLQ retry/recovery
      run: node tests/sync-dlq-retry.js
    - name: Critical orphan — read-replica recovery
      run: node tests/db-replica-recovery.js
    - name: Performance harness — false-green regression
      run: node tests/capacity-saturation-probe.js

    # ── Governance contracts ────────────────────────────────────────────────
    - name: TEST/CI parity contract — npm test ≠ whole repository
      run: node tests/ci-test-parity-contract.js
    - name: Release version contract — package.json / lock / tags coherence
      run: node tests/release-version-contract.js
    - name: M1 Runtime Probes & Scrape Regression — publishRuntimeProbes wiring
      run: node tests/runtime-probes-scrape-regression.test.js

    # ── Educational Intelligence Layer (P0-EI-01 semantic layer) ─────────────
    # D4 remediation: the 33-suite semantic-layer gate (mutation, determinism,
    # tenant isolation) previously ran nowhere in CI. Wired as an explicit
    # critical orphan so tests/ci-test-parity-contract.js P3 (npm test boundary)
    # and P6 (orphan budget) both stay satisfied.
    - name: Intelligence Layer — educational semantic suite (33 suites)
      run: node tests/semantic-layer/runner.js
    - name: Intelligence Layer — analytics wiring guard (no orphan engines)
      run: node tests/analytics-wiring-guard.test.js

    - name: Migration chain — clean install on an empty database (001 → latest)
      run: |
        DATABASE_URL="$PGURL" node tools/migrate-ledger.js up
        psql "$PGURL" -c "SELECT COUNT(*) AS tables FROM information_schema.tables WHERE table_schema='public';"
        psql "$PGURL" -c "SELECT COUNT(*) AS applied_migrations FROM schema_migrations;"
        psql "$PGURL" -c "SELECT * FROM sync_conflicts LIMIT 1;" >/dev/null && echo "sync_conflicts readable OK"

    - name: Migration 012 — real crash window / ledger recovery
      run: |
        export DATABASE_URL="$PGURL"
        node tests/migration-012-crash-recovery-live.js

    - name: Rollback chain — latest → 001
      run: |
        DATABASE_URL="$PGURL" node tools/migrate-ledger.js down-all
        LEFT=$(psql "$PGURL" -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name <> 'schema_migrations';")
        echo "tables left after DOWN ALL: $LEFT"
        [ "$LEFT" = "0" ] || { echo "DOWN ALL not clean — $LEFT table(s) left"; exit 1; }
        psql "$PGURL" -c "DROP TABLE IF EXISTS schema_migrations;"

    - name: Re-apply clean chain for the live-PG suites
      run: DATABASE_URL="$PGURL" node tools/migrate-ledger.js up
    - name: PostgreSQL Migration Ledger verification (E3 live PG)
      run: |
        export DATABASE_URL="$PGURL"
        node tests/schema-migrations-live-pg.test.js
    - name: Live-PG suites (fail without a database — P1-GAP-01)
      run: |
        export DATABASE_URL="$PGURL"
        node tests/pg-relational-seed.js
        node tests/wave3-query.js
        node tests/wave3-query3.js
        node tests/wave3-parity.js
    - name: Live-Redis suite (otp-redis — fails without Redis)
      run: node tests/otp-redis.js
    - name: Redis outage ⇒ auth fails CLOSED (BLOCKER 5)
      run: |
        if [ ! -x /usr/bin/redis-server ] && [ ! -x /usr/local/bin/redis-server ]; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
          sudo service redis-server stop || sudo systemctl stop redis-server || true
        fi
        node tests/phase2-redis-fail-closed.js
    - name: OCC across two real instances — 10 concurrent writers (BLOCKER 4)
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase2-occ-multi.js
    - name: Outbox crash/restart replay + real DLQ row (BLOCKER 3)
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase2-outbox-failover.js
    - name: Runtime Reliability — Live lease race / stale completion fencing
      run: |
        export DATABASE_URL="$PGURL"
        node tests/outbox-lease-race-live.js
    - name: Phase 6.5 Runtime Truth — Red Team RT-01…RT-10
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase65-runtime-truth.js
    - name: Production Truth Gate — 5 gates, VERIFIED or NOT VERIFIED
      run: |
        export DATABASE_URL="$PGURL"
        node tools/production-truth-gate.js
    - name: Phase 7 production verifier T1–T7 — VERIFIED or NOT VERIFIED
      run: |
        export DATABASE_URL="$PGURL"
        bash tools/production-verifier.sh
    - name: Phase 8.1 battery A — unified verifier + canary atomicity + R5 boot-gate matrix (live PG)
      run: |
        export DATABASE_URL="$PGURL"
        node tests/unified-production-verifier.js
        node tests/canary-atomic-postgres-live-runtime.js
        node tests/canary-atomic-mock-harness.js
        node tests/canary-atomic-runtime.js
        node tests/r5-prod-redis-boot-gate.js
    - name: Phase 8.1 battery B — server17 behavioural suite (isolated JSON-store contract)
      run: node tests/server17.js
      env:
        REDIS_URL: ''
    - name: Phase 8.1 battery C — migration & constraint static gates
      run: |
        node tests/migration-sequence.js
        node tests/migrate-pg-constraints.js
        node tests/schema-migrations-ledger.test.js
        node tests/migration-009-negative.test.js
    - name: Runtime Reliability — Outbox/Worker/Redis regression
      run: node tests/outbox-runtime-reliability.test.js
    - name: Runtime Reliability — Five-Task/Five-Pass independent battery
      run: node tests/runtime-reliability-five-task.test.js
    - name: Data Integrity — OCC atomic write + migration 012 recovery
      run: node tests/data-integrity-occ-migration.js
    - name: Zero-Trust Remediation — R1, R2 & R21 authoritative fail-closed suites
      run: |
        node tests/r1-eliminate-ram-authorities.test.js
        node tests/r2-postgres-authority-fail-closed.js
        node tests/schema-migrations-ledger.test.js
        node tests/c3-remediation-regression.test.js
    - name: Phase 8.1 battery D — production boot-policy suites
      run: |
        node tests/pg-prod-boot-no-db.js
        node tests/pg-prod-suite-policy.js
        node tests/pg-prod-no-json-writes.js
        node tests/redis-fallback.js
        node tests/env-flags.js
        node tests/wave15-health.js
    - run: npm run build --if-present
    - name: Smoke harness — jsdom scrollTo five-pass regression
      run: node tests/smoke-jsdom-runtime.test.js
    - run: npm test
