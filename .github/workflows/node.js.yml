# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        node-version: [22.x]
        # Release-gate honest matrix: package engines is >=22 and jsdom 30
        # requires >=22 — on 18/20 the smoke suite silently skips (exit 0),
        # which produced fake-green CI lanes. Node 18/20 lanes removed.
        # P1-GAP-02 (Chat 2 remediation): engines >=22 is additionally ENFORCED
        # in tests/run.js — an old Node now fails loudly instead of skipping.

    services:
      # P1-GAP-01 (Chat 2 remediation): the live-PG suites are first-class CI
      # citizens now — without PostgreSQL they FAIL by design (no more
      # skip/fake-green), so CI must provide a real one.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payesh
          POSTGRES_PASSWORD: payesh
          POSTGRES_DB: payesh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Phase-2 remediation (BLOCKER 8): Redis is a first-class dependency too —
      # otp-redis and the fail-closed probe run against this real service.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGURL: postgres://payesh:payesh@127.0.0.1:5432/payesh_ci
      REDIS_URL: redis://127.0.0.1:6379

    steps:
    # F-QA-07 (Chat 4 remediation): the release-version contract inspects git tags
    # (`git tag -l 'v*'` and `git show <tag>:package.json`). actions/checkout defaults to
    # a shallow, tag-less fetch, where that gate would be meaningless. Verified locally:
    # in a `--depth 1 --no-tags` clone the contract exits 1 with "no vX.Y.Z tag found" —
    # it fails loudly rather than passing vacuously, but CI still needs real history.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Provision PostgreSQL server tools for embedded-pg harness
      run: |
        set -euo pipefail
        pg_bin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
        if [ -z "$pg_bin" ] || [ ! -x "$pg_bin/postgres" ] || ! command -v redis-server >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client postgresql redis-server
          sudo service redis-server stop || sudo systemctl stop redis-server || true
          sudo service postgresql stop || sudo systemctl stop postgresql || true
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
        fi
        test -x "$pg_bin/postgres" && test -x "$pg_bin/initdb"
        sudo mkdir -p /usr/lib/postgresql/17
        if [ ! -e /usr/lib/postgresql/17/bin ]; then
          sudo ln -s "$pg_bin" /usr/lib/postgresql/17/bin
        fi
        mkdir -p /tmp/chaos-drill-tmpfs
        if ! mountpoint -q /tmp/chaos-drill-tmpfs; then
          sudo mount -t tmpfs -o size=100M,mode=1777 tmpfs /tmp/chaos-drill-tmpfs
        fi
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
        if [ ! -d /var/tmp/pw-tools/node_modules/@axe-core/playwright ]; then
          mkdir -p /var/tmp/pw-tools
          npm install --prefix /var/tmp/pw-tools --no-audit --no-fund playwright @axe-core/playwright
        fi
        /var/tmp/pw-tools/node_modules/.bin/playwright install --with-deps chromium
        PW_CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -name 'chrome' -o -name 'chrome-headless-shell' \) | head -n 1 || true)"
        SYS_CHROME="${PW_CHROME:-/usr/bin/google-chrome}"
        printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage "$@"\n' "$SYS_CHROME" | sudo tee /usr/local/bin/chromium-headless >/dev/null
        sudo chmod +x /usr/local/bin/chromium-headless
        /usr/local/bin/chromium-headless --version
        echo "CHROMIUM_PATH=/usr/local/bin/chromium-headless" >> "$GITHUB_ENV"
        echo "NODE_PATH=$GITHUB_WORKSPACE/node_modules:/var/tmp/pw-tools/node_modules" >> "$GITHUB_ENV"
        if ! pg_isready -h 127.0.0.1 -p 55432 >/dev/null 2>&1; then
          sudo rm -rf /var/tmp/pgdata-wal-drill /var/tmp/pgdata-wal-replica /var/tmp/wal-drill-run
          sudo PGBIN="$pg_bin" bash infra/wal-drill/bootstrap.sh
        fi
        DATABASE_URL="$PGURL" node tools/seed-idor-fixture.js
        echo "$pg_bin" >> "$GITHUB_PATH"
    # N-23: the lint contract used to be configured (.eslintrc.json) but eslint
    # was not a dependency, had no script, and no CI step ran it — the rule set
    # was entirely unenforced. Now installed as a devDependency and gated here.
    # --max-warnings freezes the pre-existing no-empty/no-unused-vars baseline
    # so it can only shrink; every other eslint:recommended rule is a hard
    # error and blocks the build.
    #
    # CI-DECOUPLE (PAYESH-CI-UNBLOCK, 2026-10-13): this step used to be the
    # FIRST substantive gate in the job. When it failed, GitHub Actions
    # short-circuited every subsequent step — 64 test steps were reported
    # SKIPPED on every run, so the whole test contract was silently
    # unenforced (a false-coverage, not a false-green). The lint contract is
    # now moved to the END of the job so the test matrix runs unconditionally
    # and its verdicts are always surfaced; the lint failure still fails the
    # job exactly as before (no continue-on-error, no gate weakening).
    - name: Comprehensive canonical regression runner
      timeout-minutes: 120
      run: npm run test:all
    - name: Reset shared test ports, Redis state, and clean payesh_ci schema after canonical runner
      if: always()
      run: |
        node - <<'EOF'
        const fs = require('fs');
        const Redis = require('ioredis');
        const { Client } = require('pg');
        const skip = new Set([1, process.pid, process.ppid]);
        for (const entry of fs.readdirSync('/proc')) {
          if (!/^\d+$/.test(entry)) continue;
          const pid = Number(entry);
          if (skip.has(pid)) continue;
          try {
            const cmd = fs.readFileSync('/proc/' + pid + '/cmdline', 'utf8').replace(/\0/g, ' ');
            if (/scripts\/run-all-tests\.sh|\/tmp\/mut-|\/tmp\/at-iso|\bxargs\b|\btests\/|\bserver\/index\.js/.test(cmd)) {
              process.kill(pid, 'SIGKILL');
            }
          } catch (_err) { /* process already exited */ }
        }
        (async () => {
          await new Promise((r) => setTimeout(r, 1500));
          const redis = new Redis(process.env.REDIS_URL);
          await redis.flushall();
          await redis.quit();
          const adminUrl = new URL(process.env.PGURL);
          adminUrl.pathname = '/postgres';
          const admin = new Client({ connectionString: adminUrl.toString() });
          await admin.connect();
          for (const dbName of ['payesh_bpg_probe', 'payesh_bpg_failsafe', 'payesh_runtime_reliability']) {
            await admin.query(
              'SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = $1 AND pid <> pg_backend_pid()',
              [dbName]
            );
            await admin.query('DROP DATABASE IF EXISTS ' + dbName);
          }
          await admin.end();
          const ci = new Client({ connectionString: process.env.PGURL });
          await ci.connect();
          await ci.query('DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;');
          await ci.end();
          console.log('[CI-RESET] Killed leftover runner processes, flushed Redis, and reset payesh_ci schema.');
        })().catch((err) => {
          console.error('[CI-RESET] Failed:', err);
          process.exit(1);
        });
        EOF
    - name: Zero-suite fail-closed contract (issue #454 / A-13)
      if: always()
      run: node tests/zero-suite-fail-closed.test.js
    - name: Runtime Reliability — Lease fencing static contract
      if: always()
      run: node tests/outbox-lease-fencing.test.js
    - name: Security — independent adversarial A-18..A-22 battery
      if: always()
      run: node tests/security-adversarial-a18-a22.test.js
    - name: Runtime Reliability — DLQ atomic terminal transition
      if: always()
      run: node tests/outbox-dlq-atomicity.test.js
    - name: Runtime Reliability — worker timer runs replicate path (QUEUE-CLAIM)
      if: always()
      run: node tests/worker-timer-replicate.js
    - name: Runtime Reliability — isolated fresh-DB lease race proof
      if: always()
      run: |
        set -euo pipefail
        RRDB="payesh_runtime_reliability"
        RRURL="postgres://payesh:payesh@127.0.0.1:5432/$RRDB"
        cleanup() { psql "$PGURL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RRDB;" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        psql "$PGURL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $RRDB;"
        psql "$PGURL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $RRDB;"
        DATABASE_URL="$RRURL" node tools/migrate-ledger.js up
        DATABASE_URL="$RRURL" node tests/outbox-lease-race-live.js
    # Runtime Reliability gate is intentionally early: its failure must not be hidden by later release gates.

    # QA false-green gates run before dependency-heavy live stages.
    - name: Stale path contract — historical TODO redirect
      if: always()
      run: node tests/stale-path-contract.js
    - name: Critical orphan — seed integrity
      if: always()
      run: node tests/seed-integrity.js
    - name: Phase 7 verifier contract — fixture/boundary regression
      if: always()
      run: node tests/phase7-production-verifier-contract.test.js
    - name: A-31 Intelligence semantic/certification integrity
      if: always()
      run: node tests/semantic-layer/a31-semantic-certification-integrity.test.js
    - name: Critical orphan — server security regression
      if: always()
      run: env -u REDIS_URL -u PGURL -u DATABASE_URL node tests/security2.js
    - name: Critical orphan — atomic sync batch
      if: always()
      run: node tests/sync-atomic-batch.js
    - name: Critical orphan — duplicate claim/idempotency
      if: always()
      run: node tests/sync-dup-claim.js
    - name: Critical orphan — DLQ retry/recovery
      if: always()
      run: node tests/sync-dlq-retry.js
    - name: Critical orphan — read-replica recovery
      if: always()
      run: node tests/db-replica-recovery.js
    # A-02 (P1): the dev OTP bypass must be an explicit opt-in. Runs the
    # suite AND its vulnerable-predicate mutation (A02_MUTATE=VULN); the
    # mutated run MUST fail — a green mutation would mean the negative
    # proof is dead (false green).
    - name: A-02 dev OTP bypass predicate (opt-in only)
      if: always()
      run: |
        node tests/a02-dev-otp-bypass.js
        if A02_MUTATE=VULN node tests/a02-dev-otp-bypass.js; then
          echo "❌ vulnerable predicate did NOT fail the suite (false green)"
          exit 1
        else
          echo "✅ vulnerable predicate correctly failed the suite (negative proof alive)"
        fi
    # M14-A01 (P1 claim): teacher → sync/report_logs ins. The claim expects
    # HTTP 403 but /api/sync is a batch API whose contract returns 200 with a
    # per-op verdict (sync.js:865 per-op denial + sync.js:1398 batch 200).
    # The load-bearing signal is the per-op denial + the record never being
    # written; a positive-control canary proves the store write-check is
    # alive first, so the no-write assertion cannot be a false green.
    - name: M14-A01 exception cleanup fail-closed contract
      if: always()
      timeout-minutes: 1
      run: node scripts/a01-exception-cleanup-contract.js
    - name: M14-A01 sync/report_logs teacher denial (batch contract)
      if: always()
      timeout-minutes: 5
      run: |
        node tests/a01-report-logs-repro.js
        if A01_MUTATE=VULN node tests/a01-report-logs-repro.js; then
          echo "❌ vulnerable predicate did NOT fail the suite (false green)"
          exit 1
        else
          echo "✅ vulnerable predicate correctly failed the suite (negative proof alive)"
        fi
    - name: Performance harness — false-green regression
      if: always()
      run: node tests/capacity-saturation-probe.js

    # ── Governance contracts ────────────────────────────────────────────────
    - name: TEST/CI parity contract — npm test ≠ whole repository
      if: always()
      run: node tests/ci-test-parity-contract.js
    - name: Release version contract — package.json / lock / tags coherence
      if: always()
      run: node tests/release-version-contract.js
    - name: M1 Runtime Probes & Scrape Regression — publishRuntimeProbes wiring
      if: always()
      run: node tests/runtime-probes-scrape-regression.test.js

    # ── Educational Intelligence Layer (P0-EI-01 semantic layer) ─────────────
    # D4 remediation: the 33-suite semantic-layer gate (mutation, determinism,
    # tenant isolation) previously ran nowhere in CI. Wired as an explicit
    # critical orphan so tests/ci-test-parity-contract.js P3 (npm test boundary)
    # and P6 (orphan budget) both stay satisfied.
    - name: Intelligence Layer — educational semantic suite (33 suites)
      if: always()
      run: node tests/semantic-layer/runner.js
    - name: Intelligence Layer — analytics wiring guard (no orphan engines)
      if: always()
      run: node tests/analytics-wiring-guard.test.js
    - name: Intelligence Layer — no-data-masking gate (D1)
      if: always()
      run: node tests/no-data-masking.test.js
    - name: Intelligence Layer — real timestamps + certificate fingerprint uniqueness (D2)
      if: always()
      run: node tests/analytics-timestamps.test.js
    - name: Intelligence Layer — Phase 9.0 wiring gate E2E (D3)
      if: always()
      run: node tests/semantic-analytics-e2e.test.js
    - name: Intelligence Layer — non-circular release certification (D5)
      if: always()
      run: node tests/certification-non-circular.test.js
    - name: Intelligence Layer — client consumer render gate (D6)
      if: always()
      run: node tests/intelligence-client-render.test.js

    # CI-CASCADE: the four steps below are a real dependency chain — they build,
    # verify, tear down and rebuild the shared payesh_ci schema. Steps that
    # consume that schema are gated on pg-chain-ready below; the chain steps
    # themselves are gated on their direct predecessor so a schema build that
    # never landed cannot cascade into a meaningless rollback/re-apply.
    - name: Migration chain — clean install on an empty database (001 → latest)
      id: pg-chain-up
      if: always()
      run: |
        DATABASE_URL="$PGURL" node tools/migrate-ledger.js up
        psql "$PGURL" -c "SELECT COUNT(*) AS tables FROM information_schema.tables WHERE table_schema='public';"
        psql "$PGURL" -c "SELECT COUNT(*) AS applied_migrations FROM schema_migrations;"
        psql "$PGURL" -c "SELECT * FROM sync_conflicts LIMIT 1;" >/dev/null && echo "sync_conflicts readable OK"

    - name: Migration 012 — real crash window / ledger recovery
      if: always() && steps.pg-chain-up.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/migration-012-crash-recovery-live.js

    - name: Rollback chain — latest → 001
      id: pg-chain-down
      if: always() && steps.pg-chain-up.conclusion == 'success'
      run: |
        DATABASE_URL="$PGURL" node tools/migrate-ledger.js down-all
        LEFT=$(psql "$PGURL" -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name <> 'schema_migrations';")
        echo "tables left after DOWN ALL: $LEFT"
        [ "$LEFT" = "0" ] || { echo "DOWN ALL not clean — $LEFT table(s) left"; exit 1; }
        psql "$PGURL" -c "DROP TABLE IF EXISTS schema_migrations;"

    - name: Re-apply clean chain for the live-PG suites
      id: pg-chain-ready
      if: always() && steps.pg-chain-down.conclusion == 'success'
      run: DATABASE_URL="$PGURL" node tools/migrate-ledger.js up

    # ── B-PG rework (M12 / F-1 + F-2): bounded, fail-closed PG guarantees ────
    # F-2: these three probes are wired as explicit critical orphans so their
    # outcome is CI-visible rather than glob-discovered. Each one prints a
    # greppable `B-PG-PROBE VERDICT:` line:
    #     PASS mode=FIXED | FAIL mode=FIXED | FAIL mode=LEGACY | NOT-RUN | ERROR
    # NOT-RUN means PostgreSQL could not be reached — the probe exits 1 loudly
    # and never reports a silent green (F-2 explicitly forbids
    # "PG unavailable ⇒ probe skipped ⇒ runner green").
    # They run against the postgres:17 service above and each one creates and
    # drops its own scratch database, so they never touch payesh_ci.
    - name: Critical orphan — B-PG health/readiness bounded under a runtime PG blackhole
      if: always()
      run: timeout 300 node tests/b-pg-health-blackhole.js
    - name: Critical orphan — B-PG mid-migration crash recovery (kill at the 012 ledger row)
      if: always()
      run: timeout 300 node tests/b-pg-migration-midflight-kill.js
    - name: Critical orphan — B-PG timeout misconfiguration stays bounded (unset/""/0/-1/abc)
      if: always()
      run: timeout 420 node tests/b-pg-timeout-failsafe.js
    # F-2 negative test: the LEGACY arm reproduces the pre-fix unbounded hang,
    # so it MUST exit non-zero. This step fails only if that arm goes green —
    # i.e. if the probe stops being load-bearing (false-green defence). The
    # 92s local run fits comfortably under the 300s bound.
    - name: Critical orphan — B-PG negative test, LEGACY arm must stay RED (hang reproduced)
      if: always()
      run: |
        set -u
        out="$(mktemp)"
        set +e
        timeout 300 env PROBE_LEGACY=1 node tests/b-pg-health-blackhole.js >"$out" 2>&1
        rc=$?
        set -e
        # A timeout kill (124) is a harness fault, NOT a RED verdict — a probe
        # that hangs past its bound must not pass a negative test.
        if [ "$rc" -eq 124 ]; then
          echo 'NEGATIVE TEST FAILED: LEGACY arm exceeded the 300s bound (hung past its own watchdog)'; cat "$out"; exit 1
        fi
        grep -q 'B-PG-PROBE VERDICT: FAIL mode=LEGACY' "$out" \
          || { echo 'NEGATIVE TEST FAILED: LEGACY arm produced no FAIL verdict line'; cat "$out"; exit 1; }
        if [ "$rc" -eq 0 ]; then
          echo 'NEGATIVE TEST FAILED: LEGACY arm went GREEN — the probe is no longer load-bearing'
          cat "$out"; exit 1
        fi
        echo "LEGACY arm correctly RED (exit $rc) — the B-PG-1 timeout fix stays load-bearing"
    # F-3 regression coverage: the canary SoT TTL/backoff knobs must stay
    # fail-safe against every invalid env shape. Same greppable verdict
    # contract; no live PG needed — the probe drives the engine in-process
    # and observes gate behaviour through the AUTHORITY_UNAVAILABLE branch.
    - name: Critical orphan — B-PG canary SoT TTL/backoff bounds (F-3 regression coverage)
      if: always()
      run: timeout 180 node tests/b-pg-canary-sot-bounds.js
    # F-3 negative test: the LEGACY arm reproduces the pre-fix dead gates
    # (NaN/0 ⇒ every comparison false ⇒ a synchronous PG round-trip per
    # request), so it MUST exit non-zero. This step fails only if that arm
    # goes green — i.e. if the probe stops being load-bearing.
    - name: Critical orphan — B-PG canary SoT negative test, LEGACY arm must stay RED
      if: always()
      run: |
        set -u
        out="$(mktemp)"
        set +e
        timeout 180 env PAYESH_PG_UNBOUNDED_PROBE=1 node tests/b-pg-canary-sot-bounds.js >"$out" 2>&1
        rc=$?
        set -e
        if [ "$rc" -eq 124 ]; then
          echo 'NEGATIVE TEST FAILED: LEGACY arm exceeded the 180s bound (hung past its own watchdog)'; cat "$out"; exit 1
        fi
        grep -q 'B-PG-PROBE VERDICT: FAIL mode=LEGACY' "$out" \
          || { echo 'NEGATIVE TEST FAILED: LEGACY arm produced no FAIL verdict line'; cat "$out"; exit 1; }
        if [ "$rc" -eq 0 ]; then
          echo 'NEGATIVE TEST FAILED: LEGACY arm went GREEN — the probe is no longer load-bearing'
          cat "$out"; exit 1
        fi
        echo "LEGACY arm correctly RED (exit $rc) — the F-3 canary TTL/backoff fix stays load-bearing"
    - name: PostgreSQL Migration Ledger verification (E3 live PG)
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/schema-migrations-live-pg.test.js
    - name: Live-PG suites (fail without a database — P1-GAP-01)
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/pg-relational-seed.js
        node tests/wave3-query.js
        node tests/wave3-query3.js
        node tests/wave3-parity.js
    - name: Live-Redis suite (otp-redis — fails without Redis)
      if: always()
      run: node tests/otp-redis.js
    - name: Redis outage ⇒ auth fails CLOSED (BLOCKER 5)
      if: always()
      run: |
        if [ ! -x /usr/bin/redis-server ] && [ ! -x /usr/local/bin/redis-server ]; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq redis-server
          sudo service redis-server stop || sudo systemctl stop redis-server || true
        fi
        node tests/phase2-redis-fail-closed.js
    - name: Re-audit A-22 — Redis unavailable end-to-end (fake RESP server)
      if: always()
      # boots real server instances against a hand-written RESP3 Redis, then
      # kills/partitions it: boot-gate, distributed session, cross-instance,
      # expiry, restart, and bounded-partition behaviour.
      run: node tests/reaudit-redis-outage.js
    - name: OCC across two real instances — 10 concurrent writers (BLOCKER 4)
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase2-occ-multi.js
    - name: Re-audit A-20 — OCC stale-write across all 5 PATCH paths
      if: always()
      # boots a normal + a PAYESH_STRICT_BASE_VERSION=1 instance and proves the
      # stale-write/clobber path is closed for students/users/classes/attendance/grades.
      run: node tests/reaudit-occ-stale-write.js
    - name: Re-audit A-19 — student_id cannot bypass school ownership
      if: always()
      # cross-school student_id in attendance/grades (manager/teacher/parent),
      # student_id re-pointing via PATCH, and cross-school student transfer.
      run: node tests/reaudit-a19-student-id-ownership.js
    - name: Outbox crash/restart replay + real DLQ row (BLOCKER 3)
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase2-outbox-failover.js
    - name: Runtime Reliability — Live lease race / stale completion fencing
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/outbox-lease-race-live.js
    - name: Phase 6.5 Runtime Truth — Red Team RT-01…RT-10
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tests/phase65-runtime-truth.js
    - name: Production Truth Gate — 5 gates, VERIFIED or NOT VERIFIED
      # CI-CASCADE: consumes the shared payesh_ci schema — gated on pg-chain-ready.
      if: always() && steps.pg-chain-ready.conclusion == 'success'
      run: |
        export DATABASE_URL="$PGURL"
        node tools/production-truth-gate.js
    - name: Phase 7 production verifier T1–T7 — VERIFIED or NOT VERIFIED
