    # CI-DECOUPLE (cont.): the lint contract now runs LAST. Every test step
    # above executes unconditionally regardless of the lint verdict, and the
    # lint failure still fails the job. Order change only — no rule, threshold,
    # or continue-on-error was added.
    #
    # CI-CASCADE (PAYESH-CI-RECOVERY-02, 2026-10-14): reordering was necessary
    # but NOT sufficient. Live evidence: on 7499b7cf the whole-suite runner
    # (step "Comprehensive canonical regression runner") failed with exit 5
    # (stale docs-stats freeze manifest inside scripts/run-all-tests.sh), and
    # because every step below had no `if:` condition, GitHub Actions skipped
    # ALL 63 subsequent gates — the entire test contract was reported SKIPPED,
    # i.e. unenforced, not green.
    # Every gate step below therefore carries `if: always()` so it runs and
    # surfaces its OWN verdict no matter what its siblings did. A failing step
    # still fails the job (required checks stay red); nothing is downgraded,
    # retried, or converted to a warning — the change only stops one red gate
    # from silencing 60 unrelated green/red signals.
    # The ONE preserved dependency is the shared PostgreSQL schema: steps that
    # consume the migrated payesh_ci database are gated on the dedicated
    # `pg-chain-*` step ids below, because without that schema their verdict is
    # meaningless (they would fail red for an environmental reason, not a real
    # one). B-PG probes are excluded — each creates and drops its own scratch
    # database, so they never touch payesh_ci.
    - name: Lint (N-23 — the lint contract is now enforced)
      if: always()
      run: npm run lint
