name: TEMP env-visibility probe (M15-01 diagnosis, to be deleted)
on:
  push:
    branches: ["arena/0008c4f4-p2"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Control - job-level env IS visible to a step if
        if: ${{ env.JOBLEVEL == 'yes' }}
        run: echo "control ran (job-level env visible to if)"
      - name: Experiment - step-level env visible to its OWN if?
        if: ${{ env.STEPLEVEL == 'yes' }}
        env:
          STEPLEVEL: "yes"
        run: echo "experiment ran (step-level env visible to its own if)"
    env:
      JOBLEVEL: "yes"
