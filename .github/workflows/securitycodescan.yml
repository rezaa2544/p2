# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates SecurityCodeScan with GitHub's Code Scanning feature
# SecurityCodeScan is a vulnerability patterns detector for C# and VB.NET

name: SecurityCodeScan

on:
  push:
    branches:
      - "main"
      - "arena/**"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '19 11 * * 6'

jobs:
  scope-check:
    name: SecurityCodeScan applicability (C# / VB.NET)
    runs-on: ubuntu-latest
    outputs:
      has_dotnet: ${{ steps.scope.outputs.has_dotnet }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a matching language before invoking SecurityCodeScan
        id: scope
        shell: bash
        run: |
          if find . -type f \( -name '*.cs' -o -name '*.vb' \) -not -path './.git/*' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo 'has_dotnet=true' >> "$GITHUB_OUTPUT"
            echo 'SecurityCodeScan is applicable: C# or VB.NET source found.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_dotnet=false' >> "$GITHUB_OUTPUT"
            {
              echo '## SecurityCodeScan — NOT APPLICABLE'
              echo 'No C# (.cs) or VB.NET (.vb) source files exist in this JavaScript/Node.js repository.'
              echo 'The C#/VB scanner was not run; this is a scope decision, not a clean SAST result.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  SCS:
    needs: scope-check
    if: ${{ needs.scope-check.outputs.has_dotnet == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nuget/setup-nuget@04b0c2b8d1b97922f67eca497d7cf0bf17b8ffe1
      - uses: microsoft/setup-msbuild@v1.0.2

      - name: Set up projects for analysis
        uses: security-code-scan/security-code-scan-add-action@f8ff4f2763ed6f229eded80b1f9af82ae7f32a0d

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Convert sarif for uploading to GitHub
        uses: security-code-scan/security-code-scan-results-action@cdb3d5e639054395e45bf401cba8688fcaf7a687

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@v3
