name: observability-regression

permissions:
  contents: read

on:
  push:
    paths:
      - 'server/metrics.js'
      - 'server/index.js'
      - 'infra/observability/**'
      - 'tests/observability-*.js'
      - 'tests/wave14-observability*.js'
      - '.github/workflows/observability-regression.yml'
  pull_request:
    paths:
      - 'server/metrics.js'
      - 'server/index.js'
      - 'infra/observability/**'
      - 'tests/observability-*.js'
      - 'tests/wave14-observability*.js'
      - '.github/workflows/observability-regression.yml'

jobs:
  static-and-promtool:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PASSWORD: ci-observability-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Semantic metric/label drift guard
        run: node tests/observability-semantic-guard.js
      - name: Configuration regression
        run: node tests/observability-config.js
      - name: promtool rule validation
        run: docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" prom/prometheus:v2.54.1 promtool check rules /etc/prometheus/alert-rules.yml
      - name: promtool Prometheus config validation
        run: docker run --rm -v "$PWD/infra/observability:/etc/prometheus:ro" prom/prometheus:v2.54.1 promtool check config /etc/prometheus/prometheus.yml
      - name: promtool Alertmanager config validation with non-live CI URL
        run: |
          sed 's|__WEBHOOK_URL__|https://example.invalid/alertmanager-ci|g' infra/observability/alertmanager.yml > /tmp/alertmanager.yml
          docker run --rm -v /tmp/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro prom/alertmanager:v0.27.0 amtool check-config /etc/alertmanager/alertmanager.yml
      - name: Alertmanager checked-in placeholder must fail closed
        run: |
          set +e
          docker compose -f infra/observability/docker-compose.observability.yml run --rm -T -e ALERTMANAGER_WEBHOOK_URL=__WEBHOOK_URL__ alertmanager
          code=$?
          set -e
          test "$code" -eq 78
      - name: Alertmanager placeholder must fail closed
        run: |
          set +e
          docker compose -f infra/observability/docker-compose.observability.yml run --rm -T -e ALERTMANAGER_WEBHOOK_URL= alertmanager
          code=$?
          set -e
          test "$code" -eq 78

  runtime:
    runs-on: ubuntu-latest
    needs: static-and-promtool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Healthy metric runtime
        run: node tests/wave14-observability.js
      - name: Failure and mutation runtime
        run: node tests/wave14-observability-mutations.js
      - name: Independent dashboard regression
        run: node tests/observability-dashboards.js


  promtail-runtime:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PASSWORD: ci-observability-test
    steps:
      - uses: actions/checkout@v4
      - name: Start Loki and Promtail against isolated test log files
        run: |
          set -e
          mkdir -p /tmp/payesh-logs
          : > /tmp/payesh-logs/server.log
          : > /tmp/payesh-logs/audit.log
          PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml up -d loki promtail
      - name: Inject real server and audit log lines
        run: |
          set -e
          printf '%s\n' 'runtime-promtail-server-line' >> /tmp/payesh-logs/server.log
          printf '%s\n' '{"event":"runtime-promtail-audit","trace_id":"runtime-trace-001"}' >> /tmp/payesh-logs/audit.log
      - name: Verify Loki received both streams
        run: |
          set -e
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/ready >/dev/null 2>&1 || true
            server_json="$(curl -gsS --get 'http://127.0.0.1:3100/loki/api/v1/query_range' --data-urlencode 'query={service="payesh",log_source="server-log"}' --data-urlencode 'limit=20' || true)"
            audit_json="$(curl -gsS --get 'http://127.0.0.1:3100/loki/api/v1/query_range' --data-urlencode 'query={service="payesh",log_source="audit-log"}' --data-urlencode 'limit=20' || true)"
            printf '%s' "$server_json" | grep -F 'runtime-promtail-server-line' >/dev/null 2>&1 &&
            printf '%s' "$audit_json" | grep -F 'runtime-promtail-audit' >/dev/null 2>&1 &&
            printf '%s' "$audit_json" | grep -F 'runtime-trace-001' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo 'Loki did not receive both Promtail streams in time' >&2
          exit 1
      - name: Stop isolated observability services
        if: always()
        run: PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml down -v
