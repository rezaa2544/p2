# Runtime evidence gate: this workflow intentionally executes real promtool/amtool, Alertmanager fail-closed, metric mutations, and Loki/Promtail ingestion. Queued is never green.
name: observability-regression

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
      - 'arena/**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  static-and-promtool:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PASSWORD: ci-observability-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Semantic metric/label drift guard
        run: node tests/observability-semantic-guard.js
      - name: Configuration regression
        run: node tests/observability-config.js
      - name: Configuration mutation sensitivity
        run: node tests/observability-config-mutations.js
      - name: Create protected test metrics-token file
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/payesh_metrics_token"
          printf '%s' 'ci-only-observability-test-token' > "$token_file"
          chmod 600 "$token_file"
          printf 'PAYESH_METRICS_TOKEN_FILE=%s\n' "$token_file" >> "$GITHUB_ENV"
      - name: promtool rule validation
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/promtool-rules.log"
          set +e
          docker run --rm --entrypoint=/bin/promtool --user "$(id -u):$(id -g)" \
            -v "$PWD/infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro" \
            prom/prometheus:v2.54.1 check rules /etc/prometheus/alert-rules.yml >"$output_file" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            {
              echo '## promtool rule validation diagnostics'
              grep -Ei 'error|failed|invalid|unknown|denied|not found|fatal|pull access' "$output_file" | tail -n 12 \
                | sed -E -e 's#(postgres|postgresql|redis)://[^[:space:]]+#[DSN-REDACTED]#gI' \
                        -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                        -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -E -e 's#(postgres|postgresql|redis)://[^[:space:]]+#[DSN-REDACTED]#gI' \
                 -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                 -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' "$output_file"
          rm -f "$output_file"
          exit "$rc"
      - name: promtool Prometheus config validation
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/promtool-config.log"
          set +e
          docker run --rm --entrypoint=/bin/promtool --user "$(id -u):$(id -g)" \
            -v "$PWD/infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro" \
            -v "$PAYESH_METRICS_TOKEN_FILE:/etc/prometheus/payesh_metrics_token:ro" \
            prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml >"$output_file" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            {
              echo '## promtool Prometheus config diagnostics'
              grep -Ei 'error|failed|invalid|unknown|denied|not found|fatal|pull access' "$output_file" | tail -n 12 \
                | sed -E -e 's#(postgres|postgresql|redis)://[^[:space:]]+#[DSN-REDACTED]#gI' \
                        -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                        -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -E -e 's#(postgres|postgresql|redis)://[^[:space:]]+#[DSN-REDACTED]#gI' \
                 -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                 -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' "$output_file"
          rm -f "$output_file"
          exit "$rc"
      - name: amtool Alertmanager config validation with non-live CI URL
        run: |
          set -euo pipefail
          sed 's|__WEBHOOK_URL__|https://example.invalid/alertmanager-ci|g' infra/observability/alertmanager.yml > /tmp/alertmanager.yml
          output_file="$RUNNER_TEMP/amtool-config.log"
          set +e
          docker run --rm --entrypoint=/bin/amtool \
            -v /tmp/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml >"$output_file" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            {
              echo '## amtool Alertmanager config diagnostics'
              grep -Ei 'error|failed|invalid|unknown|denied|not found|fatal|pull access' "$output_file" | tail -n 12 \
                | sed -E -e 's#(https?://)[^[:space:]]+#[URL-REDACTED]#gI' \
                        -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                        -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' || true
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -E -e 's#(https?://)[^[:space:]]+#[URL-REDACTED]#gI' \
                 -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                 -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g' "$output_file"
          rm -f "$output_file"
          exit "$rc"
      - name: Alertmanager checked-in placeholder must fail closed
        run: |
          set +e
          docker compose -f infra/observability/docker-compose.observability.yml run --rm -T -e ALERTMANAGER_WEBHOOK_URL=__WEBHOOK_URL__ alertmanager
          code=$?
          set -e
          test "$code" -eq 78
      - name: Alertmanager placeholder must fail closed
        run: |
          set +e
          docker compose -f infra/observability/docker-compose.observability.yml run --rm -T -e ALERTMANAGER_WEBHOOK_URL= alertmanager
          code=$?
          set -e
          test "$code" -eq 78
      - name: Remove protected test metrics-token file
        if: always()
        run: |
          if [[ -n "${PAYESH_METRICS_TOKEN_FILE:-}" ]]; then rm -f "$PAYESH_METRICS_TOKEN_FILE"; fi

  runtime:
    runs-on: ubuntu-latest
    needs: static-and-promtool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Healthy metric runtime
        run: node tests/wave14-observability.js
      - name: Failure and mutation runtime
        run: node tests/wave14-observability-mutations.js
      - name: Independent dashboard regression
        run: node tests/observability-dashboards.js

  promtail-runtime:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PASSWORD: ci-observability-test
    steps:
      - uses: actions/checkout@v4
      - name: Create protected test metrics-token file
        run: |
          set -euo pipefail
          umask 077
          token_file="$RUNNER_TEMP/payesh_metrics_token"
          printf '%s' 'ci-only-observability-test-token' > "$token_file"
          chmod 600 "$token_file"
          printf 'PAYESH_METRICS_TOKEN_FILE=%s\n' "$token_file" >> "$GITHUB_ENV"
      - name: Start Loki and Promtail against isolated test log files
        run: |
          set -e
          mkdir -p /tmp/payesh-logs
          chmod 755 /tmp/payesh-logs
          : > /tmp/payesh-logs/server.log
          : > /tmp/payesh-logs/audit.log
          chmod 644 /tmp/payesh-logs/server.log /tmp/payesh-logs/audit.log
          PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml up -d loki promtail
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/ready >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3100/ready
      - name: Inject real server and audit log lines
        run: |
          set -e
          printf '%s\n' 'runtime-promtail-server-line' >> /tmp/payesh-logs/server.log
          printf '%s\n' '{"event":"runtime-promtail-audit","trace_id":"runtime-trace-001"}' >> /tmp/payesh-logs/audit.log
      - name: Verify Loki received both streams and structured trace_id metadata
        run: |
          set -e
          for i in $(seq 1 60); do
            end_ns="$(date +%s%N)"
            start_ns="$((end_ns - 600000000000))"
            query_end_ns="$((end_ns + 60000000000))"
            server_json="$(curl -gsS --get 'http://127.0.0.1:3100/loki/api/v1/query_range' --data-urlencode 'query={service="payesh",log_source="server-log"}' --data-urlencode 'limit=20' --data-urlencode "start=${start_ns}" --data-urlencode "end=${query_end_ns}" --data-urlencode 'direction=forward' || true)"
            audit_json="$(curl -gsS --get 'http://127.0.0.1:3100/loki/api/v1/query_range' --data-urlencode 'query={service="payesh",log_source="audit-log"} | trace_id="runtime-trace-001"' --data-urlencode 'limit=20' --data-urlencode "start=${start_ns}" --data-urlencode "end=${query_end_ns}" --data-urlencode 'direction=forward' || true)"
            if printf '%s' "$server_json" | grep -F 'runtime-promtail-server-line' >/dev/null 2>&1 &&
               printf '%s' "$audit_json" | grep -F 'runtime-promtail-audit' >/dev/null 2>&1 &&
               printf '%s' "$audit_json" | grep -F 'runtime-trace-001' >/dev/null 2>&1; then
              echo "::notice title=Observability promtail verified::Both server-log and structured-metadata trace_id audit-log streams verified on SHA ${GITHUB_SHA}."
              exit 0
            fi
            sleep 2
          done
          echo 'Loki did not receive both Promtail streams in time' >&2
          exit 1
      - name: Publish bounded Loki/Promtail failure diagnostics
        if: failure()
        run: |
          set +e
          redact_ci_output() {
            sed -E -e 's#(postgres|postgresql|redis)://[^[:space:]]+#[DSN-REDACTED]#gI' \
                   -e 's/(password|token|secret|authorization|cookie)[^=: ]*[[:space:]]*[:=][[:space:]]*[^[:space:]]+/[REDACTED]/Ig' \
                   -e 's/[A-Fa-f0-9]{64,}/[LONG_HEX-REDACTED]/g'
          }
          diag_ps="$(PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml ps --all --format '{{.Service}} {{.State}} {{.Health}}' 2>&1 | redact_ci_output | tail -n 10 | tr '\n' '; ')"
          diag_logs="$(PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml logs --no-color --tail=20 loki promtail 2>&1 | redact_ci_output | tail -n 15 | tr '\n' ' | ')"
          echo "::notice title=Observability promtail diagnostics::ps=${diag_ps} logs=${diag_logs}"
          {
            echo '## Loki/Promtail bounded failure diagnostics'
            echo '### Container state'
            printf '%s\n' "$diag_ps"
            echo '### Recent Loki/Promtail warnings and errors'
            printf '%s\n' "$diag_logs"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Stop isolated observability services and remove test token
        if: always()
        run: |
          set +e
          PAYESH_LOG_DIR=/tmp/payesh-logs docker compose -f infra/observability/docker-compose.observability.yml down -v
          rc=$?
          if [[ -n "${PAYESH_METRICS_TOKEN_FILE:-}" ]]; then rm -f "$PAYESH_METRICS_TOKEN_FILE"; fi
          exit "$rc"
