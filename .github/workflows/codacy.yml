# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '41 5 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # codacy/codacy-analysis-cli:4.0.0 runs an Alpine JVM without a UTF-8 locale,
      # so Charset.defaultCharset() defaults to US-ASCII and Sarif.createResults
      # throws MalformedInputException on valid UTF-8 Persian source files. Pass
      # explicit UTF-8 JVM/POSIX locale environment variables into the CLI container
      # while preserving the exact unmasked container exit status.
      - name: Configure UTF-8 locale for Codacy CLI container
        shell: bash
        run: |
          set -euo pipefail
          WRAP_DIR="/tmp/codacy-utf8-docker"
          mkdir -p "$WRAP_DIR"
          cat > "$WRAP_DIR/docker" <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "run" ]; then
            shift
            set +e
            /usr/bin/docker run \
              -e JAVA_OPTS="-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8" \
              -e JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8" \
              -e LANG=C.UTF-8 \
              -e LC_ALL=C.UTF-8 \
              "$@" 2>&1 | tee /tmp/codacy-cli.log
            rc="${PIPESTATUS[0]}"
            exit "$rc"
          fi
          exec /usr/bin/docker "$@"
          EOF
          chmod 0755 "$WRAP_DIR/docker"
          echo "$WRAP_DIR" >> "$GITHUB_PATH"

      # Execute only the JavaScript analyzer. The repository contains no Java
      # source, so PMD/PMD-legacy add no security coverage and their Codacy
      # containers fail with "No rules found". Limiting the scan also prevents
      # the Codacy SARIF formatter from reading tracked binary assets.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          tool: eslint
          directory: ${{ github.workspace }}
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 0

      - name: Surface Codacy CLI failure tail annotation
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/codacy-cli.log ]; then
            set +e
            err_msg="$(grep -B2 -A25 -E 'Exception|Caused by:|ERROR|max allowed' /tmp/codacy-cli.log | tail -n 35 | tr '\r\n' '  ' | cut -c1-1800)"
            set -e
            if [ -z "$err_msg" ]; then
              err_msg="$(tail -n 35 /tmp/codacy-cli.log | tr '\r\n' '  ' | cut -c1-1800)"
            fi
            printf '::error title=Codacy CLI failure tail::%s\n' "$err_msg"
          fi

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
