name: Temporary build artifact synchronization
on:
  push:
    branches: ["fix/test-integrity-a08-a17-fg1"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.js
      - name: Commit generated tracked artifacts
        run: |
          git config user.name "Payesh Build Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- index.html USER_GUIDE.html; then
            echo "BUILD_ARTIFACTS_ALREADY_IN_SYNC"
            exit 0
          fi
          git add index.html USER_GUIDE.html
          git commit -m "chore(build): synchronize generated artifacts"
          git push origin HEAD:$GITHUB_REF_NAME
