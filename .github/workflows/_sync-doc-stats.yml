name: Temporary documentation statistics synchronization
on:
  push:
    branches: ["fix/test-integrity-a08-a17-fg1"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/docs-stats-sync.js --freeze
      - name: Commit generated documentation statistics
        run: |
          git config user.name "Payesh Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- docs; then
            echo "DOC_STATS_ALREADY_IN_SYNC"
            exit 0
          fi
          git add -u docs
          git commit -m "chore(docs): synchronize generated statistics"
          git push origin HEAD:$GITHUB_REF_NAME
