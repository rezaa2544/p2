name: "CodeQL"
# Repository Code Scanning default setup is enabled. Running this advanced
# CodeQL workflow on push/PR conflicts with default setup ("advanced configurations
# cannot be processed when default setup is enabled"). Keep a manual diagnostic
# entry point; default setup owns automatic branch/PR scanning.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL — JavaScript/Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
