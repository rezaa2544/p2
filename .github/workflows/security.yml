# ═══════════════════════════════════════════════════════════════════════
# Security Program (Wave 13) — SAST · SCA · SBOM · DAST · Secret · WAF
# -----------------------------------------------------------------------
# Repo-native Security Program CI. Principles:
#  - SAST uses the repo's OWN static security gates (no invented ESLint):
#      tests/run.js         → structure + JS syntax + offline + add()/scope guards (35 checks)
#      tools/check-authz.js → authorisation model parity (client ACTION_ROLES ⇄ server WRITE_PERMS)
#    (The jsdom XSS boot suites — tests/xss-guard.js, tests/security*.js,
#    tests/waf-ddos.js full — need a seeded server/data/payesh.json and/or a
#    booted instance; they run in the local/nightly flow, not the merge gate.)
#  - Secret scan is the repo's own tools-backed tests/secret-scan.js.
#  - SCA (npm audit) / SBOM (npm sbom) / DAST (OWASP ZAP baseline) are
#    BEST-EFFORT (continue-on-error): SCA/SBOM need a live npm registry;
#    DAST uses SECURITY_TARGET_URL when set, else boots the API locally
#    (127.0.0.1:3000) and scans it via docker host-networking. None of them
#    may break the merge gate when infra is not provisioned.
# ═══════════════════════════════════════════════════════════════════════
name: Security Program (SAST · SCA · SBOM · DAST · Secret)

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── SAST: repo-native static analysis ──────────────────────────────
  sast:
    name: SAST (repo-native static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Structure / syntax / offline + security guards (run.js)
        run: node tests/run.js
      - name: Authorisation model parity (check-authz)
        run: node tools/check-authz.js
      - name: Syntax check of core modules
        run: node --check server/index.js && node --check server/sync.js && node --check server/db.js

  # ── Secret scan ─────────────────────────────────────────────────────
  secret:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Secret scan (repo rules)
        run: node tests/secret-scan.js

  # ── SCA: dependency audit (best-effort; needs live npm registry) ────
  sca:
    name: SCA (npm audit, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: npm audit (fail at high or above)
        run: npm audit --audit-level=high

  # ── SBOM: dependency inventory (SPDX) — best-effort ─────────────────
  sbom:
    name: SBOM (npm sbom / SPDX, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Generate SBOM (SPDX JSON)
        run: npm sbom --sbom-format=spdx > sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  # ── DAST: OWASP ZAP baseline (best-effort; staging URL or local boot) ─
  dast:
    name: DAST (OWASP ZAP baseline, best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SECURITY_TARGET_URL: ${{ secrets.SECURITY_TARGET_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Resolve DAST target (staging secret, else local boot)
        id: dast-target
        run: |
          if [ -n "${SECURITY_TARGET_URL}" ]; then
            echo "mode=staging" >> "$GITHUB_OUTPUT"
            echo "url=${SECURITY_TARGET_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "url=http://127.0.0.1:3000" >> "$GITHUB_OUTPUT"
          fi
      - name: Report DAST mode (P0 #6)
        if: always()
        run: |
          if [ "$DAST_MODE" = "staging" ]; then
            echo "DAST target: **staging** (secret SECURITY_TARGET_URL set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DAST target: **local boot** (set the SECURITY_TARGET_URL repo secret to scan staging)" >> "$GITHUB_STEP_SUMMARY"
            echo "Go-Live equivalent: tools/dast-live.sh (staging = API + Redis + store, ZAP baseline/full)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "dast mode: $DAST_MODE"
        env:
          DAST_MODE: ${{ steps.dast-target.outputs.mode }}
      - name: Boot local API for DAST (no staging URL configured)
        # P0 #6: بدون secret → local boot. با secret → مستقیم staging.
        # معادلِ Go-Live: tools/dast-live.sh (DRY_RUN در سندباکس سبز است).
        if: steps.dast-target.outputs.mode == 'local'
        run: |
          node server/seed.js
          (node server/index.js > /tmp/dast-api.log 2>&1 & echo $! > /tmp/dast-api.pid)
          for i in $(seq 1 30); do
            # any HTTP code (200, or 503 when Redis is absent) proves the boot
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || echo 000)
            if [ "$code" != "000" ]; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w "dast local target HTTP %{http_code}\n" http://127.0.0.1:3000/api/health || true
      - name: OWASP ZAP baseline scan (staging target)
        if: steps.dast-target.outputs.mode == 'staging'
        # NOTE: secrets.* must not be referenced directly in `if:` on this repo —
        # GitHub rejects the workflow with zero jobs ("workflow file issue").
        # Verified empirically (bisect on wftest-branch, runs #61–#66, 2026-09-09):
        # resolve the secret into a step output and test the output in `if`.
        # (ZAP runs in BOTH modes now — staging secret, or local-boot fallback.)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.SECURITY_TARGET_URL }}
          # advisory (continue-on-error) until findings are triaged; enforcement
          # (fail on High) is a Wave 13 follow-up, not part of the merge gate.
      - name: OWASP ZAP baseline scan (local target)
        if: steps.dast-target.outputs.mode == 'local'
        # The action runs ZAP inside docker, where 127.0.0.1 is the container
        # itself — so the local target uses host networking to reach the API
        # booted above on the runner.
        # zap-baseline exit codes: 1 = FAIL findings, 2 = WARN-only (advisory),
        # 3+ = scan error. WARN-only must not fail the gate (triage + enforcement
        # is a Wave 13 follow-up, same as the staging action's fail-on-FAIL
        # semantics); FAILs and errors still fail loudly — never false-green.
        run: |
          set +e
          docker run --rm --network=host \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:3000 \
              -r /zap/wrk/zap-local-report.html \
              -J /zap/wrk/zap-local-report.json
          code=$?
          echo "zap-baseline exit code: $code (1=FAIL findings, 2=WARN-only, 3+=error)"
          if [ "$code" -eq 2 ]; then
            echo "WARN-only verdict — advisory, not failing the gate."
            exit 0
          fi
          exit "$code"
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
            zap-local-report.html
            zap-local-report.json
          if-no-files-found: warn
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/dast-api.pid ]; then kill "$(cat /tmp/dast-api.pid)" 2>/dev/null || true; fi

  # ── WAF (kept from the earlier Security (WAF) workflow) ─────────────
  waf:
    name: WAF & nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Syntax check (waf)
        run: node --check server/waf.js && node --check tests/waf-ddos.js && node --check tests/waf-mutations.js && node --check tests/waf-enforce.js
      - name: WAF unit tests (no boot)
        run: node tests/waf-ddos.js --unit-only
      - name: WAF enforce + abuse protection (P0 #6)
        # enforce: XSS/SQLi ⇒ 403 waf_blocked (fail-safe allowlist) ·
        # report پیش‌فرض دست‌نخورده · per-phone login cap · پلکانِ send-code.
        # seed لازم ندارد (boot با store خالی + fallback — شمارنده‌ها پیش از وجود‌سنجی).
        run: node tests/waf-enforce.js
      - name: Install nginx (for config test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null
      - name: Validate nginx.conf
        run: nginx -t -c $PWD/nginx/nginx.conf -p $PWD/nginx/
