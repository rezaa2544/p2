name: Notion ↔ GitHub status sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  pull_request:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: notion-github-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NOTION_API_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret NOTION_API_KEY"
            exit 1
          fi

      - name: Reconcile current GitHub state into Notion
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: "3f6ba74e-cd98-81ac-972d-e7055540a7ea"
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          command -v jq >/dev/null

          # Always query live main, not only the event payload. Missing API data fails closed.
          head_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          test "${#head_sha}" -eq 40
          issue_443="$(gh api "repos/$REPOSITORY/issues/443" --jq '"#\(.number) — \(.state | ascii_upcase): \(.title[0:70]) \(.html_url)"')"

          issues="$(gh api "repos/$REPOSITORY/issues?state=open&per_page=100" --jq '
            [.[] | select(has("pull_request") | not)]
            | sort_by(.updated_at) | reverse | .[:2][]
            | "- #\(.number) \(.title[0:65]) \(.html_url)"' | head -c 450)"
          pulls="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" --jq '
            .[:2][] | "- PR #\(.number) \(.title[0:60]) (\(.draft | if . then "draft" else "open" end)) \(.html_url)"' | head -c 350)"
          runs="$(gh api "repos/$REPOSITORY/actions/runs?branch=main&per_page=8" --jq '
            [.workflow_runs[:3][] | {
              name: .name,
              status: .status,
              conclusion: (.conclusion // "NOT_FINISHED"),
              html_url: .html_url,
              head_sha: .head_sha
            }]
            | .[] |
            "- \(.name[0:28]): \(if .status != "completed" then "IN_PROGRESS" elif .conclusion == "success" then "SUCCESS" elif .conclusion == "failure" then "FAILURE" else .conclusion end) (\(.head_sha[0:8])) \(.html_url)"' | head -c 450)"

          timestamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          summary="$(cat <<EOF
          PAYESH_SYNC_STATUS_V1
          Source of truth: GitHub repository + canonical docs; Notion is a synchronized dashboard, not an independent certification.
          Repository: $REPOSITORY | Branch: main | Current HEAD: $head_sha
          Trigger: $EVENT_NAME | Event SHA: $EVENT_SHA | Synced: $timestamp
          Workflow run: $RUN_URL

          Canonical work plan: docs/CURRENT_WORK_EXECUTION_PLAN.md; docs/ROADMAP_MASTER_EXECUTION_SCHEDULE.md; docs/ROADMAP_CURRENT_GROUND_TRUTH_2026-09-21.md
          Priority anchor: $issue_443

          Open issues (recent):
          ${issues:-UNKNOWN — GitHub returned no issue data}
          Open pull requests (recent):
          ${pulls:-NONE RETURNED}
          Latest GitHub Actions runs:
          ${runs:-UNKNOWN — GitHub returned no workflow data}

          Evidence rule: status reflects returned GitHub data only. Missing, skipped, queued, cancelled, or incomplete checks are never promoted to PASS. This snapshot does not certify production readiness.
          EOF
          )"
          # Notion rich-text text content is limited to 2,000 characters.
          if [ "${#summary}" -gt 1950 ]; then
            echo "::error::Notion snapshot exceeds safe rich-text size; refusing truncated write"
            exit 1
          fi
          payload="$(jq -n --arg summary "$summary" '{paragraph:{rich_text:[{type:"text",text:{content:$summary}}]}}')"

          # Find the existing managed paragraph so reruns update one stable snapshot instead of appending duplicates.
          cursor=""
          existing_block=""
          while :; do
            if [ -n "$cursor" ]; then
              page="$(curl --silent --show-error --fail-with-body -G "https://api.notion.com/v1/blocks/$NOTION_PAGE_ID/children" -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28" --data-urlencode "page_size=100" --data-urlencode "start_cursor=$cursor")"
            else
              page="$(curl --silent --show-error --fail-with-body -G "https://api.notion.com/v1/blocks/$NOTION_PAGE_ID/children" -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28" --data-urlencode "page_size=100")"
            fi
            existing_block="$(printf '%s' "$page" | jq -r '[.results[] | select(.type == "paragraph") | select(([.paragraph.rich_text[]?.plain_text] | join("") | contains("PAYESH_SYNC_STATUS_V1")))] | first | .id // empty')"
            [ -n "$existing_block" ] && break
            more="$(printf '%s' "$page" | jq -r '.has_more')"
            [ "$more" = "true" ] || break
            cursor="$(printf '%s' "$page" | jq -r '.next_cursor // empty')"
            [ -n "$cursor" ] || break
          done

          if [ -n "$existing_block" ]; then
            curl --silent --show-error --fail-with-body -X PATCH "https://api.notion.com/v1/blocks/$existing_block" -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28" -H "Content-Type: application/json" --data "$payload" >/dev/null
            verify="$(curl --silent --show-error --fail-with-body "https://api.notion.com/v1/blocks/$existing_block" -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28")"
            printf '%s' "$verify" | jq -e '[.paragraph.rich_text[]?.plain_text] | join("") | contains("PAYESH_SYNC_STATUS_V1")' >/dev/null
          else
            payload="$(jq -n --arg summary "$summary" '{children:[{object:"block",type:"heading_3",heading_3:{rich_text:[{type:"text",text:{content:"GitHub → Notion — Current Truth"}}]}},{object:"block",type:"paragraph",paragraph:{rich_text:[{type:"text",text:{content:$summary}}]}}]}')"
            response="$(curl --silent --show-error --fail-with-body -X PATCH "https://api.notion.com/v1/blocks/$NOTION_PAGE_ID/children" -H "Authorization: Bearer $NOTION_API_KEY" -H "Notion-Version: 2022-06-28" -H "Content-Type: application/json" --data "$payload")"
            printf '%s' "$response" | jq -e '[.results[] | select(.type == "paragraph") | [.paragraph.rich_text[]?.plain_text] | join("") | select(contains("PAYESH_SYNC_STATUS_V1"))] | length == 1' >/dev/null
          fi
          echo "Notion current-state snapshot reconciled and read-back verified; main=$head_sha; event=$EVENT_NAME"
