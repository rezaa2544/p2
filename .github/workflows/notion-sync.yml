name: Notion ↔ GitHub status sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: notion-github-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NOTION_API_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret NOTION_API_KEY"
            exit 1
          fi

      - name: Append current GitHub truth to Notion
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: "3f6ba74e-cd98-81ac-972d-e7055540a7ea"
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Read the latest workflow runs; do not infer PASS from missing data.
          runs="$(gh api "repos/$REPOSITORY/actions/runs?branch=main&per_page=8" \
            --jq '[.workflow_runs[] | {name: .name, status: .status, conclusion: (.conclusion // "NOT_FINISHED"), html_url: .html_url, head_sha: .head_sha}]')"

          latest="$(printf '%s' "$runs" | jq -r '
            if length == 0 then "No workflow runs returned — status UNKNOWN"
            else .[:5][] |
              "- " + .name + ": " +
              (if .status != "completed" then "IN_PROGRESS"
               elif .conclusion == "success" then "SUCCESS"
               elif .conclusion == "failure" then "FAILURE"
               else (.conclusion // "UNKNOWN") end) +
              " (" + .head_sha[0:8] + ") " + .html_url
            end' | head -c 3500)"

          timestamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          summary="Repository: $REPOSITORY
          Branch: main
          Event: $EVENT_NAME
          Event SHA: $EVENT_SHA
          Synced at: $timestamp
          Workflow run: $RUN_URL

          Latest workflow outcomes:
          $latest

          Authority note: this is an automated status snapshot, not a certification. Missing or incomplete runs are not PASS."

          payload="$(jq -n --arg title "GitHub sync — $timestamp" --arg summary "$summary" '
            {children: [
              {object:"block", type:"heading_3", heading_3:{rich_text:[{type:"text",text:{content:$title}}]}},
              {object:"block", type:"paragraph", paragraph:{rich_text:[{type:"text",text:{content:$summary}}]}}
            ]}')"

          response="$(curl --silent --show-error --fail-with-body \
            -X PATCH "https://api.notion.com/v1/blocks/$NOTION_PAGE_ID/children" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            --data "$payload")"

          echo "$response" | jq -e '.results | length == 2' >/dev/null
          echo "Notion sync append verified: 2 blocks; SHA=$EVENT_SHA"
