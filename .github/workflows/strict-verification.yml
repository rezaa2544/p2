name: Payesh Strict Verification Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-verification:
    name: STRICT — 3-AI Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout intended main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: A-30 gate adversarial regression
        run: node tests/strict-verification-gate-a30.test.js
      - name: Strict verification contract
        if: ${{ github.event_name != 'pull_request' }}
        env:
          STRICT_GATE_EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: node tools/strict-verification-gate.js
      - name: Core tests
        run: npm test
      - name: Detect production truth gate availability
        id: prod_truth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Production truth gate
        if: ${{ steps.prod_truth.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GATE_REQUIRE_CLEAN: "1"
        run: npm run truth-gate
