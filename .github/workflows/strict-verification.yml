name: Payesh Strict Verification Gate
on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-verification:
    name: STRICT — 3-AI Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout intended main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: A-30 V-01..V-12 negative gate fixtures
        run: node tests/strict-verification-gate.negative.test.js
      - name: A-30 contract suite (Arena-only model)
        run: node tests/strict-verification-gate-a30.test.js
      # M15-01: acceptance properties + mutation matrix. This step failing means a
      # property is unproven or a fixture is vacuous, not that a check was unavailable.
      - name: M15-01 registry & strict-verification acceptance properties
        run: node tests/m15-01-registry-strict-verification.test.js
      - name: Strict verification contract
        run: node tools/strict-verification-gate.js
      # Issue #454 item 2: a failing step must not erase the evidence of the steps
      # below it. `if: always()` keeps Core tests and the Production truth gate
      # running and surfacing their OWN verdict; the job still fails if any step
      # failed. Nothing is downgraded and no gate is weakened.
      - name: Core tests
        if: always()
        run: npm test
      # M15-01 (2026-10-27): this step exists so the gate's silence is not read as
      # evidence. The step below is guarded by `env.DATABASE_URL != ''` and skips
      # whenever secrets.DATABASE_URL is empty; tools/production-truth-gate.js fails
      # closed without a DATABASE_URL (line 154: exit 1), so skipping is the intended
      # behaviour and that guard is NOT a defect. What was missing was a record: a
      # skipped step is invisible inside a green job, so no run could state whether
      # the gate had run. This step always runs and says which case obtained.
      #
      # Scope note, measured not assumed: a step's own `env:` IS visible to that
      # step's `if`. Run 40572991240 ran the control and the experiment side by side
      # and reported BOTH as `success` (a skipped step reports `skipped`, as run
      # 40570647326 shows for this very step), so the experiment step executed. An
      # earlier reading of this file assumed the opposite and is refuted here rather
      # than quietly dropped.
      #
      # The truth gate that actually executes is in node.js.yml, where PostgreSQL is
      # provisioned and the gate is bound to the pg-chain-ready step.
      - name: Report production truth gate availability
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL}" ]; then
            echo "secrets.DATABASE_URL is present — the production truth gate below runs."
          else
            echo "::warning title=Production truth gate NOT RUN::secrets.DATABASE_URL is empty, so the truth gate cannot run in this job (it fails closed without a URL). This job makes no claim that it ran."
          fi
      - name: Production truth gate
        if: ${{ always() && env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GATE_REQUIRE_CLEAN: "1"
        run: npm run truth-gate
