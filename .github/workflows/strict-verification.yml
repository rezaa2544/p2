name: Payesh Strict Verification Gate
on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-verification:
    name: STRICT — 3-AI Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payesh
          POSTGRES_PASSWORD: payesh
          POSTGRES_DB: payesh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout intended main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure PostgreSQL client and redis-server binary for truth-gate chaos checks
        run: |
          mkdir -p /tmp/m15-01-strict-evidence
          if [ ! -x /usr/bin/psql ] || [ ! -x /usr/bin/redis-server ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client redis-server
            if sudo systemctl is-active --quiet redis-server; then
              sudo systemctl stop redis-server
            fi
          fi
      - name: Install dependencies
        run: npm ci
      - name: A-30 V-01..V-12 negative gate fixtures
        run: node tests/strict-verification-gate.negative.test.js
      - name: A-30 contract suite (Arena-only model)
        run: node tests/strict-verification-gate-a30.test.js
      # M15-01: acceptance properties + mutation matrix. This step failing means a
      # property is unproven or a fixture is vacuous, not that a check was unavailable.
      - name: M15-01 registry & strict-verification acceptance properties
        run: node tests/m15-01-registry-strict-verification.test.js
      - name: M15-01 two-phase SHA binding & provenance consistency fixtures
        run: node tests/two-phase-provenance-consistency.test.js
      - name: Strict verification contract
        run: |
          set -o pipefail
          mkdir -p /tmp/m15-01-strict-evidence
          node tools/strict-verification-gate.js 2>&1 | tee /tmp/m15-01-strict-evidence/strict-verification-gate.log
      - name: Registry provenance audit
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/m15-01-strict-evidence
          node tools/registry-provenance.js --audit 2>&1 | tee /tmp/m15-01-strict-evidence/registry-provenance-audit.log
      # Issue #454 item 2: a failing step must not erase the evidence of the steps
      # below it. `if: always()` keeps Core tests and the Production truth gate
      # running and surfacing their OWN verdict; the job still fails if any step
      # failed. Nothing is downgraded and no gate is weakened.
      - name: Core tests
        if: always()
        run: npm test
      - name: Production truth gate
        if: always()
        env:
          DATABASE_URL: postgres://payesh:payesh@127.0.0.1:5432/payesh_ci
          REDIS_URL: redis://127.0.0.1:6379
          GATE_REQUIRE_CLEAN: "1"
        run: |
          set -o pipefail
          mkdir -p /tmp/m15-01-strict-evidence
          npm run truth-gate 2>&1 | tee /tmp/m15-01-strict-evidence/production-truth-gate.log
      - name: Record SHA-256 digests of strict-verification logs
        if: always()
        run: |
          mkdir -p /tmp/m15-01-strict-evidence
          (cd /tmp/m15-01-strict-evidence && sha256sum *.log > SHA256SUMS.txt)
          SUMMARY=$(tr '\n' ';' < /tmp/m15-01-strict-evidence/SHA256SUMS.txt)
          echo "::notice title=M15-01 Strict Evidence SHA256::sha=${GITHUB_SHA} ${SUMMARY}"
      - name: Upload strict-verification raw logs and SHA-256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-01-strict-gate-evidence-${{ github.sha }}
          path: /tmp/m15-01-strict-evidence/
          retention-days: 30
