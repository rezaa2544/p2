name: Payesh Strict Verification Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-verification:
    name: STRICT — 3-AI Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Strict verification contract
        run: node tools/strict-verification-gate.js
      - name: A-30 V-01..V-12 negative gate fixtures
        run: node tests/strict-verification-gate.negative.test.js
      - name: Core tests
        run: npm test
      - name: Production truth gate
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GATE_REQUIRE_CLEAN: "1"
        run: npm run truth-gate
