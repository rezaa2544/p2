# ═══════════════════════════════════════════════════════════════════
# پایش — پیکربندی سنیتنل 1 از ۳ (فاز ۲.۱)
# سه سنیتنل روی سه میزبان مستقل؛ اجماع با quorum=2.
# ═══════════════════════════════════════════════════════════════════
port 26379
bind 0.0.0.0
protected-mode no                    # سنیتنل باید از نودهای دیگر قابل دسترس باشد

sentinel monitor payesh-master {{REDIS_NODE1_HOST}} 6379 2
sentinel auth-pass payesh-master {{REDIS_PASSWORD}}
sentinel down-after-milliseconds payesh-master 5000
sentinel failover-timeout payesh-master 60000
sentinel parallel-syncs payesh-master 1

dir /var/lib/redis/sentinel-1
logfile /var/log/redis/sentinel-1.log
