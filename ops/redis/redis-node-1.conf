# ═══════════════════════════════════════════════════════════════════
# پایش — پیکربندی نود دادهٔ ردیس (نود 1 از ۳) — فاز ۲.۱
# نود ۱ = مستر؛ نود ۲ و ۳ = تکثیر (خط‌های replicaof را ببینید).
# رمزها فقط از طریق جای‌دار {{…}} در زمان استقرار جایگذاری می‌شوند؛
# هرگز رمز واقعی را در مخزن ثبت نکنید (اصل «بدون راز در کد»).
# ═══════════════════════════════════════════════════════════════════

port 6379
bind 0.0.0.0
protected-mode yes
requirepass {{REDIS_PASSWORD}}
masterauth {{REDIS_PASSWORD}}

# ── نود 1: نود ۲ و ۳ تکثیرِ نود ۱ هستند ──
# نود ۱ مستر است؛ replicaof ندارد.

# ── پایداری (فاز ۲.۱): RDB + AOF هم‌زمان ───────────────────────────
# RDB: عکس فوری با سه آستانه (طبق مصوبهٔ فاز ۲.۱)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes      # fail-closed: خطای ذخیره پنهان نمی‌ماند

# AOF: ثبت هر ثانیه — تعادل سرعت/امنیت طبق مصوبه
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-load-truncated yes               # بازیابی حتی اگر AOF در کرش بریده باشد

dir /var/lib/redis/node-1

# ── عملیات ──
maxmemory-policy noeviction          # دادهٔ نشست/شمارنده هرگز بیرون انداخته نشود
tcp-keepalive 60
timeout 0
loglevel notice
logfile /var/log/redis/node-1.log
