# Payesh — CircleCI real gate.
#
# D4 remediation: the previous configuration's only job (`say-hello`) ran
# `echo Hello, World!`. It was the sole green check on the current HEAD while
# executing no test at all — a textbook false-green. This job runs the actual
# build-integrity and educational-intelligence suites so the "success" check
# means something. `cimg/base:current` ships Node.js (>=22 required).
version: 2.1

jobs:
  payesh-node-gate:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Report Node version (must be >= 22)"
          command: |
            node --version
            MAJOR=$(node --version | sed 's/v\([0-9]*\).*/\1/')
            if [ "$MAJOR" -lt 22 ]; then
              echo "Node >= 22 required, found $MAJOR — failing loudly instead of silently skipping."
              exit 1
            fi
      - run:
          name: "Client build integrity + offline guarantees (tests/run.js)"
          command: node tests/run.js
      - run:
          name: "Educational intelligence semantic suite (33 suites)"
          command: node tests/semantic-layer/runner.js
      - run:
          name: "Analytics wiring guard (rejects orphan engines)"
          command: node tests/analytics-wiring-guard.test.js
      - run:
          name: "No-data-masking gate (D1)"
          command: node tests/no-data-masking.test.js
      - run:
          name: "Real timestamps + fingerprint uniqueness (D2)"
          command: node tests/analytics-timestamps.test.js
      - run:
          name: "Phase 9.0 wiring gate E2E (D3)"
          command: node tests/semantic-analytics-e2e.test.js

workflows:
  payesh-gate:
    jobs:
      - payesh-node-gate
