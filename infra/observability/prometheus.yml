# ═══════════════════════════════════════════════════════════════════════
# prometheus.yml — scrape configِ پایش (ویو ۱۴)
# ───────────────────────────────────────────────────────────────────────
# اسکرپ از «هر instance» : targets لیستِ صریحِ میزبان‌هاست (استندبای/منطقهٔ دوم
# هم فقط یک خط اضافه کردن است)؛ endpoint برنامه /metrics است — server/metrics.js.
# در compose، Prometheus داخلِ شبکه می‌دود و به اپ روی میزبان از طریق
# host.docker.internal می‌رسد (extra_hosts). اگر METRICS_TOKEN روی سرویس‌ها
# تنظیم شده، same key را اینجا بگذارید (تستِ نام‌ها در observability-config).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: payesh

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: payesh-api
    metrics_path: /metrics
    # در حالتِ توکن: هدرِ ثابت لازم است (کلید از env-file با envsubst ساده)
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          instance_role: primary
      # نمونهٔ چند-اینستانس (استیجینگ/منطقهٔ دوم را همین‌جا اضافه کنید):
      # - targets: ["10.10.0.12:3000", "10.10.0.13:3000"]
      #   labels: { instance_role: secondary }
  - job_name: prometheus-self
    static_configs:
      - targets: ["127.0.0.1:9090"]
