# ═══════════════════════════════════════════════════════════════════════
# prometheus.yml — scrape configِ پایش (ویو ۱۴)
# Canonical rules: alert-rules.yml only. alerts.yml is retired to prevent
# duplicate/stale rule evaluation.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: payesh

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: payesh-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          instance_role: primary
      # - targets: ["10.10.0.12:3000", "10.10.0.13:3000"]
      #   labels: { instance_role: secondary }
  - job_name: prometheus-self
    static_configs:
      - targets: ["127.0.0.1:9090"]
