# ═══════════════════════════════════════════════════════════════════════
# alert-rules.yml — قوانینِ بحرانیِ P0 (ویو ۱۴)
# Semantic contract: every metric and selector below must match the
# declarations and emitted labels in server/metrics.js on the same HEAD.
groups:
  - name: payesh-critical
    rules:
      - alert: HighErrorRate
        expr: |
          (sum(rate(payesh_http_requests_total{code=~"5.."}[5m]))
           / clamp_min(sum(rate(payesh_http_requests_total[5m])), 0.01)) > 0.001
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "نرخ ۵xx بیش از ۰٫۱٪ (پنجره ۵د)"
          description: "ارزشِ لحظه‌ای {{ $value | humanizePercentage }} — شیفتِ on-call (DR_RUNBOOK §۰)"
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(payesh_http_request_duration_seconds_bucket[5m]))) > 0.300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 بیش از ۳۰۰ms"
          description: "p95={{ $value | humanizeDuration }} — اولِ مسیرهایِ sync را با trace_id در لاگِ Grafana/Loki ببینید"
      - alert: RedisDown
        expr: payesh_redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "ردیس در دسترس نیست (rate-limit/idempotency تحتِ فشارِ fail-closed)"
          description: "لایهٔ کشِ health طبقِ P0-13 قرمز است؛ /api/health را ببینید و سناریوی §۲ DR_RUNBOOK را اجرا کنید"
      - alert: DBLatencyHigh
        expr: payesh_db_up == 1 and payesh_db_query_latency_ms > 50
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "تأخیرِ نمونه‌ایِ SELECT-1 دیتابیس بیش از ۵۰ms"
          description: "sampled at scrape time via healthCheck — با p95ِ HTTP و pool waiting هم‌سنجی کنید"
      - alert: SyncQueueDepth
        expr: payesh_sync_queue_depth > 1000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "صفِ outbox/sync بیش از ۱۰۰۰ رویدادِ pending"
          description: "worker را ببینید (server/worker.js)؛ مصرف‌کننده‌ی مرده = دادهٔ stale در همهٔ کلاینت‌ها"
      - alert: EventLoopLagHigh
        expr: payesh_node_eventloop_lag_seconds > 0.1
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "lagِ event-loop بیش از ۱۰۰ms"
          description: "Canonical runtime gauge; بدون label selector تا empty-vector drift ایجاد نشود."
      - alert: MemoryHigh
        expr: payesh_node_heap_used_bytes / clamp_min(payesh_node_heap_total_bytes, 1) > 0.80
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "heap بیش از ۸۰٪ِ heapTotal"
          description: "Canonical Node heap gauges؛ بررسی OOM/leak طبق runbook."
      - alert: DiskSpaceLow
        expr: payesh_disk_used_ratio > 0.85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "مصرفِ دیسکِ فایل‌سیستمِ مسیرِ داده بیش از ۸۵٪"
          description: "سری‌ها از statfs در زمانِ scrape می‌آیند (server/metrics.js)"
      - alert: AnomalyDetected
        expr: sum(increase(payesh_runtime_anomalies_total[5m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Runtime anomaly detected"
          description: "A bounded runtime anomaly signal exceeded its rolling baseline."
      - alert: AttackPatternSignature
        expr: sum by (pattern, severity) (increase(payesh_attack_patterns_detected_total[5m])) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Runtime attack pattern signature detected"
          description: "A bounded attack signature fired; contain per RC-016."
      - alert: SuspiciousSession
        expr: payesh_suspicious_sessions > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Suspicious runtime session retained"
          description: "One or more suspicious sessions are retained for triage."
