# ═══════════════════════════════════════════════════════════════════════
# docker-compose.observability.yml — استکِ زندهٔ Observability (ویو ۱۴)
#   Prometheus + Alertmanager + Grafana + Loki + Promtail + OTel Collector + Jaeger
#
# Production guard: ALERTMANAGER_WEBHOOK_URL must be owner-provided. The
# checked-in __WEBHOOK_URL__ placeholder is never accepted by a live process.
# ═══════════════════════════════════════════════════════════════════════
name: payesh-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$ALERTMANAGER_WEBHOOK_URL" || { echo 'ALERTMANAGER_WEBHOOK_URL is required; refusing placeholder alerting config' >&2; exit 78; }
        test "$$ALERTMANAGER_WEBHOOK_URL" != "__WEBHOOK_URL__" || { echo 'ALERTMANAGER_WEBHOOK_URL is still the repository placeholder' >&2; exit 78; }
        url=$$(printf '%s' "$$ALERTMANAGER_WEBHOOK_URL" | sed 's/[\\&|]/\\&/g')
        sed "s|__WEBHOOK_URL__|$$url|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD را در env-file بگذارید}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - graf-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - ${PAYESH_LOG_DIR:-../../server/data}:/var/log/payesh:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    volumes:
      - ./otelcol-config.yml:/etc/otelcol/config.yml:ro
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.59
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/var/lib/jaeger
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

volumes:
  prom-data:
  graf-data:
  loki-data:
  jaeger-data:
