# Jaeger v2 با بک‌اندِ Elasticsearch (تک‌گره؛ shards/replicas برای تک‌گره).
# کلیدها از: cmd/jaeger/config-elasticsearch.yaml و internal/storage/elasticsearch/config (v2.20.0).
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: {level: warn}
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
extensions:
  jaeger_query: {storage: {traces: prod_store}}
  jaeger_storage:
    backends:
      prod_store:
        elasticsearch:
          server_urls: [http://elasticsearch:9200]
          auth:
            basic:
              username: elastic
              password: ${env:ELASTIC_PASSWORD}
          indices:
            index_prefix: payesh-prod
            spans: {date_layout: "2006-01-02", rollover_frequency: day, shards: 3, replicas: 0}
            services: {date_layout: "2006-01-02", rollover_frequency: day, shards: 1, replicas: 0}
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors: {batch: {}}
exporters:
  jaeger_storage_exporter: {trace_storage: prod_store}
