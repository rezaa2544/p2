# rabbitmq.conf — M15-07: فقط-AMQPS (بدونِ هر listenerِ plain)
# هیچ listener TCP خام: اتصالِ بدونِ TLS در سطحِ سرور رد می‌شود.
listeners.tcp = none

# listener امن (تنها درگاهِ AMQP)
listeners.ssl.default = 5671

# TLS 1.2/1.3 — verify_peer؛ احرازِ هویت با PLAIN (رمز) روی کانالِ رمز
ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile   = /etc/rabbitmq/tls/server.crt
ssl_options.keyfile    = /etc/rabbitmq/tls/server.key
ssl_options.verify     = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3

# لاگِ متعادل + محدودیتِ اتصال‌های هر کاربر (دفاعِ noisy-neighbor)
log.console = true
log.console.level = info
channel_max = 128
