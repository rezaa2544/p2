# ═══════════════════════════════════════════════════════════════════════
# docker-compose.ha.yml — PostgreSQL HA: Primary + Standby + PgBouncer
# ───────────────────────────────────────────────────────────────────────
#   • Streaming replication (asynchronous + hot_standby) — فایِل‌اور با
#     tools/failover-postgres.sh
#   • WAL archiving با pgbackrest به object storage (MinIO/S3) — پایهٔ PITR
#   • PgBouncer (transaction pooling) — درِ ورودِ برنامه (6432)
#   • پیمایشِ RPO/RTO و سناریوها: docs/HA_POSTGRES.md + docs/DR_RUNBOOK.md
#   • تطبیقِ کدِ برنامه: DATABASE_URL ⇒ pgbouncer:6432/payesh و
#     READ_DATABASE_URL ⇒ pgbouncer:6432/payesh-readonly (server/db.js)
#
# اجرا (روی میزبان، از ریشهٔ ریپو):
#   cp infra/postgres/env.ha.example infra/postgres/.env.ha   # و پر کردن
#   docker compose -f infra/postgres/docker-compose.ha.yml --env-file infra/postgres/.env.ha up -d
#   bash infra/postgres/post-checks.sh                          # سلامتِ replication/archive
#
# اصلِ امنیت: هیچ رمزی در این فایل نیست — همه از env-file (دارای 0600 و
# gitignored: .env*)؛ پورت‌ها فقط به 127.0.0.1 bind می‌شوند (edge/TLS با
# nginx یا VPC انجام می‌شود — docs/WAF_DDOS_SETUP.md).
# ═══════════════════════════════════════════════════════════════════════
name: payesh-pg-ha

x-pg-build: &pg-build
  build:
    context: ../../infra/postgres
    dockerfile: Dockerfile

x-pgbackrest-env: &pgbackrest-env
  PGBACKREST_REPO1_S3_KEY: ${PGHA_S3_KEY:?PGHA_S3_KEY را در env-file بگذارید}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${PGHA_S3_SECRET:?PGHA_S3_SECRET را در env-file بگذارید}
  PB_REPO_S3_ENDPOINT: ${PB_REPO_S3_ENDPOINT:-minio:9000}
  PB_REPO_S3_BUCKET: ${PB_REPO_S3_BUCKET:-payesh-pgbackrest}
  PB_REPO_S3_REGION: ${PB_REPO_S3_REGION:-us-east-1}
  PB_REPO_S3_VERIFY_TLS: ${PB_REPO_S3_VERIFY_TLS:-n}

services:
  # ── شیئی (S3-compatible) — اگر S3 واقعی دارید این سرویس را بردارید و
  #    endpoint/cred را به S3 تنظیم کنید (repo1-type=s3 همان است) ──
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER را در env-file بگذارید}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD را در env-file بگذارید}
    volumes:
      - miniadata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb -p "local/$${PB_REPO_S3_BUCKET:-payesh-pgbackrest}" || true
        echo "bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  # ── Primary ──
  pg-primary:
    <<: *pg-build
    environment:
      <<: *pgbackrest-env
      POSTGRES_DB: payesh
      POSTGRES_USER: ${PGHA_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PGHA_PASSWORD:?PGHA_PASSWORD را در env-file بگذارید}
      REPLICATION_PASSWORD: ${PGHA_REPLICATION_PASSWORD:?PGHA_REPLICATION_PASSWORD را در env-file بگذارید}
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=payesh archive-push %p
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - wal_keep_size=1GB
      - -c
      - shared_buffers=1GB
      - -c
      - shared_preload_libraries=''
    volumes:
      - pgdata-primary:/var/lib/postgresql/data
      - wal-spool:/var/spool/pgbackrest
      - ./entrypoints:/opt/payesh/entrypoints:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./pgbackrest.conf.template:/opt/payesh/pgbackrest.conf.template:ro
    entrypoint: ["/bin/bash", "/opt/payesh/entrypoints/primary-entrypoint.sh"]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d payesh"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # ── Standby (خواندنی؛ ستونِ RPO≤۵دقیقه در سنجه‌های RELIABILITY_DR_PLAN) ──
  pg-standby:
    <<: *pg-build
    environment:
      <<: *pgbackrest-env
      POSTGRES_DB: payesh
      POSTGRES_USER: ${PGHA_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PGHA_PASSWORD}
      REPLICATION_PASSWORD: ${PGHA_REPLICATION_PASSWORD}
      PRIMARY_HOST: pg-primary
      STANDBY_BOOTSTRAP: ${STANDBY_BOOTSTRAP:-stream}
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hot_standby=on
      - -c
      - restore_command=pgbackrest --stanza=payesh archive-get %f %p
    volumes:
      - pgdata-standby:/var/lib/postgresql/data
      - wal-spool:/var/spool/pgbackrest
      - ./entrypoints:/opt/payesh/entrypoints:ro
      - ./pgbackrest.conf.template:/opt/payesh/pgbackrest.conf.template:ro
    entrypoint: ["/bin/bash", "/opt/payesh/entrypoints/standby-entrypoint.sh"]
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payesh && psql -U postgres -d payesh -tAc \"SELECT 1 FROM pg_stat_wal_receiver WHERE status='streaming'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped

  # ── استخر اتصال (درِ برنامه) ──
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    environment:
      PGHOST: pg-primary
      PGPORT: "5432"
      PGDATABASE: payesh
      PGUSER: pgbouncer
      PGPASSWORD: ${PGHA_REPLICATION_PASSWORD}
      AUTH_QUERY: SELECT usename, passwd FROM pg_shadow WHERE usename=$1
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "3500"
      DEFAULT_POOL_SIZE: "80"
      MIN_POOL_SIZE: "5"
      LISTENPORT: "6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped

  # ── بازویِ عملیاتیِ پشتیبان: full/diff/incremental + expire ──
  # اجرایِ زمان‌بندی‌شده با cron روی میزبان (sample در docs/HA_POSTGRES.md §۵)
  pg-backup:
    <<: *pg-build
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'pg-backup ready — pgbackrest stanza=payesh'; exec sleep infinity"]
    environment:
      <<: *pgbackrest-env
    volumes:
      - pgdata-primary:/var/lib/postgresql/data:ro
      - wal-spool:/var/spool/pgbackrest
      - ./entrypoints:/opt/payesh/entrypoints:ro
      - ./pgbackrest.conf.template:/opt/payesh/pgbackrest.conf.template:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata-primary:
  pgdata-standby:
  wal-spool:
  miniadata:
