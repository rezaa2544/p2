;; ═══════════════════════════════════════════════════════════════════
;; pgbouncer.ini — استخرِ اتصالِ برنامه (transaction pooling)
;; ───────────────────────────────────────────────────────────────────
;; مسیرِ سرویس‌ها ثابت است (شبکهٔ compose)؛ هنگامِ failover دستی، تنها
;; خطِ host در [databases] تغییر می‌کند و `kill -HUP` کافی است (بدون
;; قطعیِ استخرِ سمتِ برنامه). auth_query: احرازِ برنامه مستقیم به postgres
;; می‌رود؛ pgbouncer فقط با کاربرِ pgbouncer (init/01) رمزها را از
;; pg_shadow می‌خواند — هیچ رازی در این فایل نیست.
;; دقت: session-level features (LISTEN/NOTIFY، advisory lock، temp table)
;; در حالت transaction گران/نادرست می‌شوند — برنامهٔ پایش این‌ها را در
;; مسیرِ داغ ندارد؛ رجوع: docs/HA_POSTGRES.md §۴.
[databases]
payesh        = host=pg-primary  port=5432 dbname=payesh
payesh-readonly = host=pg-standby port=5432 dbname=payesh

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename = $1
auth_user = pgbouncer
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_reset_query = DEALLOCATE ALL
server_lifetime = 3600
server_idle_timeout = 600
query_timeout = 300
ignore_startup_parameters = extra_float_digits,options
stats_users = stats, pgbouncer
admin_users = pgbouncer
log_connections = 1
log_disconnections = 0
