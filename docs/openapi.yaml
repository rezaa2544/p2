      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, target_weight]
              properties:
                cluster_id: { type: string }
                target_weight: { type: number, minimum: 0, maximum: 100 }
                approved: { type: boolean, default: false }
                signature: { type: string, description: امضای اپراتور (یا سرآیند x-operator-signature) }
                reason: { type: string }
      responses:
        '200':
          description: وزن ترافیک ارتقا یافت
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  cluster: { type: object }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: forbidden | PHASE6_APPROVAL_REQUIRED | INVALID_OPERATOR_SIGNATURE
