              required: [cluster_id]
              properties:
                cluster_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: تخلیهٔ کامل انجام شد
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  cluster_id: { type: string }
                  drained: { type: boolean }
                  target_weight: { type: number }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: ROLLBACK_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }

  /api/system/canary/status:
    get:
      tags: [observability]
      summary: مستعارِ فاز ۶ — همان GET /api/v1/system/phase6/canary/status (مسیر مستقیم index.js)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: اسنپ‌شات موتور قناری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/system/canary/promote:
    post:
      tags: [observability]
      summary: مستعارِ فاز ۶ — همان POST /api/v1/system/phase6/canary/promote
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id, target_weight]
              properties:
                cluster_id: { type: string }
                target_weight: { type: number, minimum: 0, maximum: 100 }
                approved: { type: boolean }
                signature: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: وزن ترافیک ارتقا یافت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/system/canary/rollback:
    post:
      tags: [observability]
      summary: مستعارِ فاز ۶ — همان POST /api/v1/system/phase6/canary/rollback
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id]
              properties:
                cluster_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: تخلیهٔ کامل انجام شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/system/canary/circuit-breaker:
    post:
      tags: [observability]
      summary: مستعارِ فاز ۶ — همان POST /api/v1/system/phase6/canary/circuit-breaker
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster_id]
              properties:
                cluster_id: { type: string }
                circuit_breaker_open: { type: boolean }
                secondary_dc: { type: string }
                status: { type: string }
      responses:
        '200':
          description: وضعیت کلاستر به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: cluster_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }

components:
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          description: بار اختصاصی اندپوینت (ساختار در server/index.js و ماژول‌های routes مستند است)
        code:
          type: string
        message:
          type: string
  schemas:
    AnalyticsReport:
      type: object
      description: پوشِ استاندارد گزارش‌های هوشمندی؛ ساختار data در هر اندپوینت متمایز است و در server/routes/analytics.js مستند می‌شود.
      required: [ok]
      properties:
        ok:
          type: boolean
        data:
          type: object
          description: اسنپ‌شات گزارش (ساختار اختصاصی هر گزارش)
        code:
          type: string
          description: فقط در خطاها
        message:
          type: string
          description: فقط در خطاها

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: نشست کوکی‌محور `HttpOnly; Secure; SameSite=Lax` با جی‌دابلیوتی سخت‌شده و ابطال جی‌تی‌آی روی ردیس
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: توکن ضدسی‌اس‌آرف برای درخواست‌های تغییردهنده (در حال حاضر توسط لایهٔ نشست پوشش داده می‌شود؛ تعریف برای شفافیت)
    metricsToken:
      type: apiKey
      in: header
      name: X-Metrics-Token
      description: توکن اسکراپ متریک‌ها — با متغیر محیطی `METRICS_TOKEN` مقایسه می‌شود

  parameters:
    SchoolScope:
      name: X-School-Id
      in: header
      required: false
      description: اسکوپ مدرسه — از نشست هم قابل استخراج است
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: کرسور پول دلتا (ای۰۱) — از پاسخ قبلی
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: حداکثر تعداد رکورد در صفحه
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Page:
      name: page
      in: query
      required: false
      description: شمارهٔ صفحه (از ۱)
      schema: { type: integer, minimum: 1, default: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: نسخهٔ رکورد برای او‌سی‌سی — در صورت کهنگی، ۴۰۹
      schema: { type: string }

  responses:
    BadRequest:
      description: درخواست نامعتبر (۴۰۰)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: نشست نامعتبر یا منقضی (۴۰۱)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: اسکوپ/نقش ناکافی (۴۰۳)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: منبع یافت نشد (۴۰۴)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: تعارض نسخه/هم‌زمانی (۴۰۹)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: عبور از نرخ مجاز (۴۲۹) — با سرآیند `Retry-After`
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: خطای داخلی (۵۰۰) — با شناسهٔ رخداد برای ردیابی
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: سرویس در دسترس نیست — تخلیهٔ آرام/درین (۵۰۳)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [ok, code]
      properties:
        ok: { type: boolean, example: false }
        code: { type: string, description: کد ماشینی خطا, example: not_found }
        message: { type: string }
        event_id: { type: string, description: شناسهٔ رخداد برای همبستگی لاگ }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }
    SendCodeRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, description: شمارهٔ موبایل با پیش‌شمارهٔ مجاز (نگهبان آرای۹۷), example: '09120000000' }
    LoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string, example: '09120000000' }
        code: { type: string, description: کد یک‌بارمصرف, example: '123456' }
    Session:
      type: object
      properties:
        ok: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
        school_id: { type: string }
        roles:
          type: array
          items: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: string }
        role: { type: string, description: نقش در مدل مجوز یکتا, example: teacher }
        version: { type: integer, description: نسخهٔ او‌سی‌سی }
    UserInput:
      type: object
      required: [phone, name, role]
      properties:
        phone: { type: string }
        name: { type: string }
        role: { type: string }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
    Student:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        national_id: { type: string, description: کد ملی — در پاسخ‌ها ماسک می‌شود }
        class_id: { type: string }
        school_id: { type: string }
        version: { type: integer }
        deleted_at: { type: string, format: date-time, nullable: true, description: سنگ‌قبر — حذف منطقی }
    StudentInput:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        national_id: { type: string }
        class_id: { type: string }
    StudentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Student' }
    Teacher:
      type: object
      description: رزرو — اندپوینت سروری هنوز ندارد؛ مدل داده در دیکشنری
      properties:
        id: { type: string }
        name: { type: string }
        subject: { type: string }
    ClassRoom:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        grade_level: { type: string }
        school_id: { type: string }
        version: { type: integer }
    ClassInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        grade_level: { type: string }
    ClassPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClassRoom' }
    AttendanceRecord:
      type: object
      properties:
        id: { type: string }
        student_id: { type: string }
        class_id: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [present, absent, late, excused] }
        version: { type: integer }
    AttendanceInput:
      type: object
      required: [student_id, date, status]
      properties:
        student_id: { type: string }
        date: { type: string, format: date }
        status: { type: string, enum: [present, absent, late, excused] }
    AttendancePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AttendanceRecord' }
    Grade:
      type: object
      properties:
        id: { type: string }
        student_id: { type: string }
        lesson: { type: string }
        score: { type: number, minimum: 0, maximum: 20 }
        term: { type: string }
        version: { type: integer }
    GradeInput:
      type: object
      required: [student_id, lesson, score]
      properties:
        student_id: { type: string }
        lesson: { type: string }
        score: { type: number, minimum: 0, maximum: 20 }
        term: { type: string }
    GradePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Grade' }
    PageMeta:
      type: object
      properties:
        ok: { type: boolean }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        next_cursor: { type: string, nullable: true }
    SyncPushRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            type: object
            required: [entity, op, payload]
            properties:
              entity: { type: string, example: students }
              op: { type: string, enum: [create, update, delete] }
              payload: { type: object }
              base_version: { type: integer }
    SyncPushResult:
      type: object
      properties:
        ok: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              accepted: { type: boolean }
              reason: { type: string }
              new_version: { type: integer }
    ConflictList:
      type: object
      properties:
        ok: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              entity: { type: string }
              server_value: { type: object }
              client_value: { type: object }
    ResolveConflictRequest:
      type: object
      required: [conflict_id, winner]
      properties:
        conflict_id: { type: string }
        winner: { type: string, enum: [server, client] }
    DeltaPull:
      type: object
      properties:
        ok: { type: boolean }
        cursor: { type: string, description: کرسور بعدی }
        changes:
          type: array
          items:
            type: object
            properties:
              entity: { type: string }
              op: { type: string }
              row: { type: object }
        tombstones:
          type: array
          description: سنگ‌قبرهای حذف منطقی
          items:
            type: object
            properties:
              entity: { type: string }
              id: { type: string }
              deleted_at: { type: string, format: date-time }
    Bootstrap:
      type: object
      properties:
        ok: { type: boolean }
        school: { type: object }
        classes:
          type: array
          items: { $ref: '#/components/schemas/ClassRoom' }
    BellStatus:
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string, example: class }
        until: { type: string, format: date-time, nullable: true }
    PublicReport:
      type: object
      properties:
        ok: { type: boolean }
        generated_at: { type: string, format: date-time }
        stats: { type: object }
    SmsSendRequest:
      type: object
      required: [to, text]
      properties:
        to: { type: string }
        text: { type: string, maxLength: 500 }
    BackupResult:
      type: object
      properties:
        ok: { type: boolean }
        backup_id: { type: string }
        created_at: { type: string, format: date-time }
    RestoreRequest:
      type: object
      required: [backup_id]
      properties:
        backup_id: { type: string }
    HealthStatus:
      type: object
      properties:
        ok: { type: boolean }
        db: { type: string, example: up }
        redis: { type: string, example: up }
        draining: { type: boolean }
    HealthIndex:
      type: object
      properties:
        ok: { type: boolean }
        index: { type: number, description: شاخص سلامت مدرسه, example: 0.87 }
        components: { type: object }

  examples:
    PullExample:
      summary: پاسخ پول دلتا
      value:
        ok: true
        cursor: 'eyJ2IjoxMjM0fQ'
        changes:
          - entity: students
            op: update
            row: { id: st_1, first_name: زهرا, version: 7 }
        tombstones:
          - entity: students
            id: st_9
            deleted_at: '2026-09-10T12:00:00Z'
    StudentExample:
      summary: ایجاد دانش‌آموز
      value:
        first_name: زهرا
        last_name: محمدی
        class_id: cls_3
