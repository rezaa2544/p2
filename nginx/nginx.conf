# nginx/nginx.conf — لبهٔ POC برای پایش (WAF سبک + ضدِ DDoS سطحِ ۷).
# پیش‌نیازِ واقعیِ پروداکشن: Cloudflare (رایگان) یا AWS WAF (سند: docs/WAF_DDOS_SETUP.md).
# خودکفا: بدونِ include (با `nginx -t -c $PWD/nginx/nginx.conf -p $PWD/nginx/` چک می‌شود).
user nobody;
worker_processes auto;
daemon off;
error_log /tmp/payesh-nginx-error.log warn; # در داکر: /dev/stderr
pid /tmp/payesh-nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    access_log /tmp/payesh-nginx-access.log combined; # در داکر: /dev/stdout

    # مسیرهای موقتِ هرمتیک تا `nginx -t` بدونِ root هم سبز شود
    client_body_temp_path /tmp/payesh-nginx-client-body;
    proxy_temp_path /tmp/payesh-nginx-proxy;
    fastcgi_temp_path /tmp/payesh-nginx-fastcgi;
    uwsgi_temp_path /tmp/payesh-nginx-uwsgi;
    scgi_temp_path /tmp/payesh-nginx-scgi;

    # ── §۱.۴ پرامپت: نرخِ ۱۰۰ در دقیقه + burst ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn_status 429;

    # ── ربات‌های مخرب شناخته‌شده → 444 (بستنِ بی‌پاسخ؛ لاگ می‌ماند) ──
    map $http_user_agent $bad_bot {
        default 0;
        ~*sqlmap|nikto|nmap|masscan|hydra|metasploit|zgrab|nessus|openvas|wpscan|gobuster|ffuf 1;
    }

    # ── traversalِ آشکار در URI (خام + کدشده) → 403 ──
    # توجه: $request_uri خام است (normalize نمی‌شود) پس شکل‌های کدشده را هم می‌گیریم؛
    # در پروداکشن normalize با Cloudflare است و این نگهبان فقط لایهٔ دوم است.
    map $request_uri $traversal {
        default 0;
        ~*\.\.[\\/] 1;
        ~*\.\.%2f 1;
        ~*%2e%2e 1;
        ~*%2e%2f 1;
        ~*/etc/(passwd|shadow) 1;
        ~*etc%2f(passwd|shadow) 1;
    }

    # ── ویو ۱۲: بلاکِ لبه برایِ تزریقِ SQL و اسکریپتِ بین‌صفحه‌ای → 403 ──
    # لایهٔ دومِ دفاع؛ مرجعِ کاملِ قانون‌ها و تشخیصِ درون‌برنامه: server/waf.js
    # (آن لایه فقط-تشخیص است؛ اِعمال این‌جاست). نشانه‌هایِ شروع/پایان برایِ
    # استخراجِ رگکس‌ها توسطِ tests/wave12-network.js است — حذف نشوند.
    # موجز: «;» و «#» در رگکسِ مجاز نیستند (نحوِ نگینکس)؛ از معادل‌ها استفاده شده.
    # wave12-edge-rules:start
    map $request_uri $edge_attack {
        default 0;
        # SQLi — ترکیب‌هایِ کلاسیک
        ~*union(%20|\+|\s)+(all(%20|\+|\s)+)?select 1;
        ~*\b(or|and)(%20|\+|\s)+\d+(%20|\+|\s)*=(%20|\+|\s)*\d+ 1;
        # نویسه‌های نقل‌قول با معادلِ هگز (نحوِ نگینکس «"» و «'» را می‌بلعد)
        ~*(\x27|\x22)(%20|\+|\s)*(or|and)(%20|\+|\s)+(\x27|\x22|\d) 1;
        ~*(drop|truncate)(%20|\+|\s)+(table|database) 1;
        ~*select(%20|\+|\s)+.*(%20|\+|\s)+from 1;
        ~*insert(%20|\+|\s)+into 1;
        ~*delete(%20|\+|\s)+from 1;
        ~*update(%20|\+|\s)+\w+(%20|\+|\s)+set 1;
        ~*(sleep|benchmark|pg_sleep)(%20|\+|\s)*\( 1;
        ~*information_schema 1;
        ~*--(%20|\+|\s|$) 1;
        # XSS — نشانه‌ها و رویدادها (خام + کدشده)
        ~*<script 1;
        ~*%3cscript 1;
        ~*javascript(%20|\+|\s)*: 1;
        ~*javascript%3a 1;
        ~*<(img|svg|iframe|object|embed|video|audio|body|style|link|meta)\b 1;
        ~*%3c(img|svg|iframe|object|embed) 1;
        ~*[?&]on\w{2,}(%20|\+|\s)*= 1;
        ~*\son\w{2,}(%20|\+|\s)*= 1;
    }
    # wave12-edge-rules:end

    upstream payesh {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080; # POC بدونِ root؛ در پروداکشن ۸۰/۴۴۳ پشتِ Cloudflare
        server_name _;

        # هدرِ هویتِ واقعیِ کلاینت برای لاگ/نرخِ لایهٔ بعد
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        if ($bad_bot) { return 444; }
        if ($traversal) { return 403; }
        # ویو ۱۲: تزریق/اسکریپت → بلاکِ لبه (لایهٔ دوم؛ تشخیصِ برنامه در سرور)
        if ($edge_attack) { return 403; }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            proxy_pass http://payesh;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 10;
            proxy_pass http://payesh;
        }
    }
}
