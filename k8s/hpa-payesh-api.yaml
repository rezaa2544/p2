# HPA for the stateless Payesh API (POC — see docs/AUTO_SCALING_SETUP.md §0 for
# prerequisites: PG store, shared REDIS_URL, Deployment/payesh-api, metrics pipeline).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payesh-api-hpa
  labels:
    app: payesh-api
    tier: national-scale-poc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payesh-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 5-minute cooldown (do not flap on dips)
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom pods metric: served via Prometheus + prometheus-adapter from the
    # app's future /metrics endpoint (PREREQ — HPA stays degraded until wired).
    - type: Pods
      pods:
        metric:
          name: http_requests_queue_length
        target:
          type: AverageValue
          averageValue: 1000
